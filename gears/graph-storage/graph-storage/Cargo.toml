[package]
name = "cf-gears-graph-storage"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Graph Storage gear: typed, multi-tenant knowledge graph with search and traversal"

[lints]
workspace = true

[features]
default = []
integration = []

[dependencies]
graph-storage-sdk = { package = "cf-gears-graph-storage-sdk", path = "../graph-storage-sdk" }

anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true }

axum = { workspace = true, features = ["macros"] }
http = { workspace = true }

toolkit = { workspace = true }
toolkit-canonical-errors = { workspace = true, features = ["axum", "utoipa"] }
toolkit-security = { workspace = true }
toolkit-macros = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
toolkit-db = { workspace = true, features = ["pg"] }
toolkit-db-macros = { workspace = true }

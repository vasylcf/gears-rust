# Spec-quality check for the gears-rust fork (copy to .github/workflows/spec-quality.yml there).
#
# It lives on the fork's branch `spec-quality-demo`, not on `main`: `main` stays a copy of
# upstream, so Sync fork and task branches for PRs to constructorfabric/gears-rust are untouched.
# Demo PRs target `spec-quality-demo`; a pull_request run takes the workflow from the PR's merge
# ref, which has it from the base.
#
# The jobs run on a self-hosted runner with the label `spec-quality` (pm3, or the home server):
# the specq code (vasylcf/neurosymbolic, private) is synced to $NS_HOME/specq-src there, and
# LiteLLM, the local models and graph-storage listen on 127.0.0.1. No inbound port; the runner
# pulls jobs. Each step starts with `NS_HOME=${NS_HOME:-$HOME/ns-demo}`; the runner's own .env
# may set NS_PY (default python3): on pm3 the deploy/pm3/py wrapper, the host Python lacks numpy.
#
#   gate    deterministic rules, base…head; fails the check on a new blocking finding
#   review  the same plus the model checks (advisory); review threads and a summary comment
#   pages   review and index also publish the graph view to GitHub Pages (gh-pages): pr/<N>/ for a PR,
#           linked from every thread, and the branch's map at the root
#   index   on a push to spec-quality-demo (or run by hand): warms the fact cache for the next PRs and uploads SARIF of the
#           findings at that branch to code scanning (Security tab). Not on PRs: code scanning would
#           comment on the same lines as the threads
#
# The fork is public: `review` runs only for branches of this repository, never for a PR from
# another fork (its workflow file would run on the server). Also set Settings → Actions →
# General → "Require approval for all external contributors".

name: spec-quality

on:
  pull_request:
    paths: ["**/*.md"]
  push:
    branches: [spec-quality-demo]
    paths: ["**/*.md"]
  workflow_dispatch:        # rebuild the branch map (index) by hand

permissions:
  contents: read

concurrency:
  group: spec-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # What to check: gear directories (their docs/), or `--docs-root DIR --name LABEL .` for a
  # repository laid out otherwise. graph-storage and settings-service have no documents on
  # upstream since a92339a.
  SCOPE: >-
    gears/system/oagw gears/file-storage gears/llm-gateway gears/mini-chat
  # Extra findings for the branch map (paths relative to the specq code): a full judge run and the
  # conflicts checked by reading, both carried over to the branch's revision by text
  MAP_EXTRA: >-
    --judged eval/judge/contradiction-fork-c0763c6.json --judged eval/judge/contradiction-fork-c0763c6-250.json
    --labelled eval/judge/contradiction-verified.json --labelled-rev 1388209b62e576f6d74c026343495954a79a279d
  BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  gate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, spec-quality]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Deterministic rules, base…head
        run: |
          NS_HOME=${NS_HOME:-$HOME/ns-demo}
          cd "$NS_HOME/specq-run"
          PYTHONPATH="$NS_HOME/specq-src" "${NS_PY:-python3}" -m specq --repo "$GITHUB_WORKSPACE" --base "$BASE" --head "$HEAD" \
            --md gate.md --json gate.json $SCOPE
      - name: Summary
        if: always()
        run: f="${NS_HOME:-$HOME/ns-demo}/specq-run/gate.md"; test -f "$f" && cat "$f" >> "$GITHUB_STEP_SUMMARY" || true

  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, spec-quality]
    timeout-minutes: 40
    permissions:
      # contents: write only for resolveReviewThread (GraphQL refuses it with pull-requests alone);
      # this job runs our code from the server, never code from the PR
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Keys from the server's deploy env (masked)
        run: |
          NS_HOME=${NS_HOME:-$HOME/ns-demo}
          k=$(grep '^LITELLM_MASTER_KEY=' "$NS_HOME/deploy/.env" | cut -d= -f2-)
          o=$(grep '^OPENAI_KEY=' "$NS_HOME/deploy/.env" | cut -d= -f2-)
          echo "::add-mask::$k"; echo "::add-mask::$o"
          { echo "NS_LLM_API_KEY=$k"; echo "NS_OPENAI_KEY=$o"; echo "NS_LLM_URL=http://127.0.0.1:4000"; } >> "$GITHUB_ENV"
      - name: Rules and model checks, base…head
        run: |
          NS_HOME=${NS_HOME:-$HOME/ns-demo}
          cd "$NS_HOME/specq-run"
          PYTHONPATH="$NS_HOME/specq-src" "${NS_PY:-python3}" -m specq --repo "$GITHUB_WORKSPACE" --base "$BASE" --head "$HEAD" --model \
            --md review.md --json review.json --sarif review.sarif $SCOPE || true
          test -f review.json
      - name: Graph page for this PR (GitHub Pages)
        id: page
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          NS_HOME=${NS_HOME:-$HOME/ns-demo}
          cd "$NS_HOME/specq-run"
          mkdir -p "pages/pr-$PR"
          PYTHONPATH="$NS_HOME/specq-src" "${NS_PY:-python3}" -m specq.view --repo "$GITHUB_WORKSPACE" --rev "$HEAD" \
            --findings review.json --pr "$PR" --title "Spec graph, PR #$PR" \
            --repo-url "https://github.com/$GITHUB_REPOSITORY" --out "pages/pr-$PR/index.html" $SCOPE
          "$NS_HOME/specq-src/deploy/gears-rust/publish-pages.sh" "pages/pr-$PR" "pr/$PR" "PR #$PR at ${HEAD:0:12}"
      - name: Review threads and summary comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PAGE_OK: ${{ steps.page.outcome == 'success' }}
        run: |
          NS_HOME=${NS_HOME:-$HOME/ns-demo}
          cd "$NS_HOME/specq-run"
          page=()
          if [ "$PAGE_OK" = true ]; then
            base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/pr/$PR/"
            page=(--view-url "${base}#f-{fingerprint}" --page-url "${base}#pr")
          fi
          PYTHONPATH="$NS_HOME/specq-src" "${NS_PY:-python3}" -m specq.github --repo "$GITHUB_REPOSITORY" \
            --pr "$PR" --findings review.json "${page[@]}"
          cat review.md >> "$GITHUB_STEP_SUMMARY"

  index:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, spec-quality]
    timeout-minutes: 40
    permissions:
      contents: write          # the map page goes to gh-pages
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Keys from the server's deploy env (masked)
        run: |
          NS_HOME=${NS_HOME:-$HOME/ns-demo}
          k=$(grep '^LITELLM_MASTER_KEY=' "$NS_HOME/deploy/.env" | cut -d= -f2-)
          o=$(grep '^OPENAI_KEY=' "$NS_HOME/deploy/.env" | cut -d= -f2-)
          echo "::add-mask::$k"; echo "::add-mask::$o"
          { echo "NS_LLM_API_KEY=$k"; echo "NS_OPENAI_KEY=$o"; echo "NS_LLM_URL=http://127.0.0.1:4000"; } >> "$GITHUB_ENV"
      - name: Findings at the branch (the push's own changes judged)
        run: |
          NS_HOME=${NS_HOME:-$HOME/ns-demo}
          cd "$NS_HOME/specq-run"
          PYTHONPATH="$NS_HOME/specq-src" "${NS_PY:-python3}" -m specq --repo "$GITHUB_WORKSPACE" --base "$BASE" --head "$HEAD" --model \
            --sarif branch.sarif --json branch.json $SCOPE || true
          cp branch.sarif "$GITHUB_WORKSPACE/specq.sarif"
      - name: Map page of the branch (GitHub Pages)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NS_HOME=${NS_HOME:-$HOME/ns-demo}
          cd "$NS_HOME/specq-run"
          mkdir -p pages/branch
          PYTHONPATH="$NS_HOME/specq-src" "${NS_PY:-python3}" -m specq.view --repo "$GITHUB_WORKSPACE" --rev "$HEAD" \
            --findings branch.json --all --title "Spec graph, ${GITHUB_REF_NAME}" \
            $MAP_EXTRA \
            --repo-url "https://github.com/$GITHUB_REPOSITORY" --out pages/branch/index.html $SCOPE
          "$NS_HOME/specq-src/deploy/gears-rust/publish-pages.sh" pages/branch . "${GITHUB_REF_NAME} at ${HEAD:0:12}"
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: specq.sarif
          category: specq

iction.value", "gate": "advise", "subject": "thread summary trigger / default compression threshold: DESIGN.md:1599 vs phase-4-trigger.md:31", "message": "Both specify the default compression threshold for the same proactive thread-summary trigger against the effective input token budget, but A sets it to 80% and B to 60%. Although B is in an implementation plan, it presents 60% as an existing design constraint attributed to DESIGN.md, not as a proposed change.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 1599, "line_end": 1599, "quote": "Default threshold: **80%**.", "text": [[1598, ""], [1599, "1. **Proactive (first summary):** `assembled_context_tokens >= compression_threshold_pct% of effective_budget` AND no existing summary. Default threshold: **80%**."], [1600, "2. **Urgent (re-summarize):** Context assembly had to truncate (drop) older messages (`messages_truncated = true`). This means the existing summary is stale and the conversation is losing context."]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#trigger-timing", "title": "Trigger timing", "line": 1579}}, {"path": "gears/mini-chat/docs/plans/thread-summary-worker/phase-4-trigger.md", "line_start": 31, "line_end": 31, "quote": "- Default compression threshold: **60%** of effective input token budget.", "text": [[30, "- When a summary already exists and context is not truncated, trigger MUST NOT fire."], [31, "- Default compression threshold: **60%** of effective input token budget."], [32, "- Durable scheduling MUST occur only in the same transaction that makes the causing turn durable."]], "section": {"id": "sec:gears/mini-chat/docs/plans/thread-summary-worker/phase-4-trigger.md#design-constraints", "title": "Design Constraints", "line": 22}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/plans/thread-summary-worker/phase-4-trigger.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "b419ebe6975e3f90", "rule": "contradiction.value", "gate": "advise", "subject": "compression threshold / default: DESIGN.md:1604 vs phase-4-trigger.md:31", "message": "Both passages specify the default for the same thread-summary compression threshold using the same effective input token budget. Although passage B is in an implementation plan, it presents 60% as a design constraint from DESIGN.md, not as a proposed change or future alternative. An implementer must choose between 80% and 60%.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 1604, "line_end": 1604, "quote": "The default compression threshold SHOULD be **80% of the effective input token budget**.", "text": [[1603, ""], [1604, "The default compression threshold SHOULD be **80% of the effective input token budget**."], [1605, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#trigger-timing", "title": "Trigger timing", "line": 1579}}, {"path": "gears/mini-chat/docs/plans/thread-summary-worker/phase-4-trigger.md", "line_start": 31, "line_end": 31, "quote": "- Default compression threshold: **60%** of effective input token budget.", "text": [[30, "- When a summary already exists and context is not truncated, trigger MUST NOT fire."], [31, "- Default compression threshold: **60%** of effective input token budget."], [32, "- Durable scheduling MUST occur only in the same transaction that makes the causing turn durable."]], "section": {"id": "sec:gears/mini-chat/docs/plans/thread-summary-worker/phase-4-trigger.md#design-constraints", "title": "Design Constraints", "line": 22}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/plans/thread-summary-worker/phase-4-trigger.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "afe0c85042d8664b", "rule": "contradiction.value", "gate": "advise", "subject": "quota exceeded error response / quota scope: DESIGN.md:1150 vs PRD.md:1065", "message": "Both passages define the current quota_exceeded response contract. A requires code_interpreter as the scope for daily code interpreter quota exhaustion, while B lists the permitted scope alternatives without code_interpreter. These are presented as complete alternatives, not examples, so implementing that exhaustion response requires choosing between the two contracts.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 1150, "line_end": 1150, "quote": "The `quota_scope` field is REQUIRED when `code` is `quota_exceeded` and MUST be one of: \"tokens\" (token-based rate limit exhaustion), \"uploads\" (per-user daily upload limit exhaustion), \"web_search\" (per-user daily web search call limit exhaustion), \"code_interpreter\" (per-user daily code interpreter call limit exhaustion), or \"image_inputs\" (per-turn or per-day image input limit exhaustion).", "text": [[1149, ""], [1150, "**Quota error disambiguation invariant**: token quota exhaustion, upload quota exhaustion, web search quota exhaustion, code interpreter quota exhaustion, and image input quota exhaustion MUST be distinguishable to clients via the stable, machine-readable `quota_scope` field on every `quota_exceeded` error response. Clients MUST NOT parse the `message` string to determine quota scope. The `quota_scope` field is REQUIRED when `code` is `quota_exceeded` and MUST be one of: `\"tokens\"` (token-based rate limit exhaustion), `\"uploads\"` (per-user daily upload limit exhaustion), `\"web_search\"` (per-user daily web search call limit exhaustion), `\"code_interpreter\"` (per-user daily code interpreter call limit exhaustion), or `\"image_inputs\"` (per-turn or per-day image input limit exhaustion)."], [1151, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#provider-event-translation", "title": "Provider Event Translation", "line": 1083}}, {"path": "gears/mini-chat/docs/PRD.md", "line_start": 1065, "line_end": 1065, "quote": "| `quota_exceeded` | 429 | Quota exhaustion. Always accompanied by `quota_scope`: `\"tokens\"` (token rate limits across all tiers exhausted, emergency flags, or all models disabled), `\"uploads\"` (daily upload quota exceeded), `\"web_search\"` (per-user daily web search call quota exhausted), or `\"image_inputs\"` (per-turn or per-day image input limit exceeded) |", "text": [[1064, "| `not_latest_turn` | 409 | Target `request_id` is not the most recent non-deleted turn; retry/edit/delete mutations apply only to the latest turn |"], [1065, "| `quota_exceeded` | 429 | Quota exhaustion. Always accompanied by `quota_scope`: `\"tokens\"` (token rate limits across all tiers exhausted, emergency flags, or all models disabled), `\"uploads\"` (daily upload quota exceeded), `\"web_search\"` (per-user daily web search call quota exhausted), or `\"image_inputs\"` (per-turn or per-day image input limit exceeded) |"], [1066, "| `rate_limited` | 429 | Provider upstream throttling (provider 429 after OAGW retry exhaustion) |"]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#sse-streaming-contract", "title": "SSE Streaming Contract", "line": 1040}}], "gear": "gears/mini-chat", "source": "llm:local-main+cloud-mini>cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "path": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "c57592cd1324b6bb", "rule": "contradiction.lifecycle", "gate": "advise", "subject": "context truncation / priority order: DESIGN.md:230 vs PRD.md:473", "message": "Both describe active P1 context-budget enforcement. Passage A explicitly allows dropping the thread summary after other content is truncated, whereas Passage B requires preserving it. An implementation would have to choose whether the thread summary can be dropped. Passage B's parenthetical list does not itself establish a conflicting truncation order; the explicit conflict is thread-summary preservation.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 230, "line_end": 230, "quote": "When context exceeds the budget, the system truncates in reverse priority: retrieval excerpts first, then document summaries, then old messages, then thread summary (droppable). System prompt and current user message are never truncated.", "text": [[229, ""], [230, "When context exceeds the budget, the system truncates in reverse priority: retrieval excerpts first, then document summaries, then old messages, then thread summary (droppable). System prompt and current user message are never truncated."], [231, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#context-window-budget", "title": "Context Window Budget", "line": 215}}, {"path": "gears/mini-chat/docs/PRD.md", "line_start": 473, "line_end": 473, "quote": "When the assembled context exceeds the budget, the system MUST truncate lower-priority content (old messages, document summaries, retrieval excerpts) while preserving the system prompt and thread summary.", "text": [[472, ""], [473, "The system MUST enforce a maximum input token budget per request. When the assembled context exceeds the budget, the system MUST truncate lower-priority content (old messages, document summaries, retrieval excerpts) while preserving the system prompt and thread summary. A reserve for output tokens MUST always be maintained."], [474, ""]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#token-budget-enforcement", "title": "Token Budget Enforcement", "line": 469}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give a different lifecycle or timing for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "path": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "718cc2b2cd455aa8", "rule": "contradiction.cardinality", "gate": "advise", "subject": "image input / maximum per message: PRD.md:258 vs PRD.md:1581", "message": "Both passages specify a default for the same per-message image limit: A gives 4, while B's P1 Defaults section gives 1. Although B includes a deployment configuration example, the stated limit itself is part of the defaults list, not merely an example override. Configurability does not resolve the incompatible defaults.", "locations": [{"path": "gears/mini-chat/docs/PRD.md", "line_start": 258, "line_end": 258, "quote": "Maximum image inputs per message: configurable (default: 4).", "text": [[257, "- Maximum file size per image: configurable per deployment (default: 16 MiB; PM target: 25 MiB). Uses the same `uploaded_file_max_size_kb` config as documents unless overridden by `uploaded_image_max_size_kb`."], [258, "- Maximum image inputs per message: configurable (default: 4)."], [259, "- Maximum image inputs per user per day: configurable (default: 50)."]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#image-upload", "title": "Image Upload", "line": 248}}, {"path": "gears/mini-chat/docs/PRD.md", "line_start": 1581, "line_end": 1581, "quote": "Max image inputs per message: 1 (deployment config example: `max_images_per_message: 1`)", "text": [[1580, "- Image upload size limit: same as above unless overridden (deployment config example: `uploaded_image_max_size_kb: 16384`)"], [1581, "- Max image inputs per message: 1 (deployment config example: `max_images_per_message: 1`)"], [1582, "- Max image inputs per user per day: 50 (deployment config example: `max_images_per_user_daily: 50`)"]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#131-p1-defaults-configurable", "title": "P1 Defaults (configurable)", "line": 1566}}], "gear": "gears/mini-chat", "source": "llm:local-main+cloud-mini>cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give a different count or multiplicity for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/PRD.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "e3168b2800242e9a", "rule": "contradiction.value", "gate": "advise", "subject": "maximum image input per message / default: PRD.md:461 vs PRD.md:1581", "message": "Both specify the default maximum image count for a message, but A gives 4 and B gives 1. B appears under P1 Defaults and states the limit independently of its parenthetical configuration example; it is not marked as a proposed or future alternative. Configurability allows overrides but does not reconcile the different defaults.", "locations": [{"path": "gears/mini-chat/docs/PRD.md", "line_start": 461, "line_end": 461, "quote": "- Maximum image inputs per message: default 4.", "text": [[460, ""], [461, "- Maximum image inputs per message: default 4."], [462, "- Maximum image inputs per user per day: default 50. **Whole-request rejection policy**: if the number of images in the request would cause the daily quota to be exceeded (e.g., remaining daily quota is 2 but request contains 4 images), the entire request MUST be rejected with `quota_exceeded` (`quota_scope = \"image_inputs\"`) before any provider call. No partial acceptance of images within a single request."]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#per-user-usage-quotas", "title": "Per-User Usage Quotas", "line": 439}}, {"path": "gears/mini-chat/docs/PRD.md", "line_start": 1581, "line_end": 1581, "quote": "Max image inputs per message: 1 (deployment config example: `max_images_per_message: 1`)", "text": [[1580, "- Image upload size limit: same as above unless overridden (deployment config example: `uploaded_image_max_size_kb: 16384`)"], [1581, "- Max image inputs per message: 1 (deployment config example: `max_images_per_message: 1`)"], [1582, "- Max image inputs per user per day: 50 (deployment config example: `max_images_per_user_daily: 50`)"]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#131-p1-defaults-configurable", "title": "P1 Defaults (configurable)", "line": 1566}}], "gear": "gears/mini-chat", "source": "llm:local-main+cloud-mini>cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/PRD.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "6023ba3a21c3844e", "rule": "contradiction.value", "gate": "advise", "subject": "turn / default meaning: DESIGN.md:110 vs DESIGN.md:2703", "message": "Both passages give current definitions of the same turn tracked in `chat_turns`. A explicitly excludes a message-pair definition, while B explicitly adopts it. B does not distinguish a separate kind of turn or qualify its definition as applying only to message content, so these are incompatible definitions rather than additional lifecycle detail.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 110, "line_end": 110, "quote": "Turn — unless otherwise qualified, \"turn\" in this document means \"execution turn\" (the `chat_turns` lifecycle unit), not a message pair.", "text": [[109, "- **Execution turn** (aka \"chat turn\") — a lifecycle unit tracked in the `chat_turns` table that represents a single user-initiated provider invocation. An execution turn owns the full request lifecycle: quota reserve, provider call, SSE streaming, finalization (CAS guard), quota settlement, and outbox emission. Exactly one execution turn maps to one `(chat_id, request_id)` pair."], [110, "- **Turn** — unless otherwise qualified, \"turn\" in this document means \"execution turn\" (the `chat_turns` lifecycle unit), not a message pair."], [111, "- **Background/system task** — an internal server-initiated operation (thread summary update, document summary generation) that invokes the LLM provider but MUST NOT create a `chat_turns` record. System tasks are not execution turns and do not participate in `chat_turns` idempotency, finalization CAS, or per-user quota settlement (see System Task Isolation Invariant in section 3.2)."]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#13-architecture-layers", "title": "Architecture Layers", "line": 69}}, {"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 2703, "line_end": 2703, "quote": "A turn is a user-message + assistant-response pair identified by `request_id` in `chat_turns`.", "text": [[2702, ""], [2703, "A turn is a user-message + assistant-response pair identified by `request_id` in `chat_turns`. The \"last turn\" is defined deterministically as the non-deleted turn with the greatest `(started_at, id)` for the given `chat_id` where `deleted_at IS NULL`. Index: `(chat_id, started_at DESC) WHERE deleted_at IS NULL`."], [2704, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#definition", "title": "Definition", "line": 2701}}], "gear": "gears/mini-chat", "source": "llm:local-main+cloud-mini>cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "f5c7de52f4ed96a3", "rule": "contradiction.value", "gate": "advise", "subject": "quota usage settlement / premium bucket update: DESIGN.md:2218 vs DESIGN.md:5313", "message": "Both prescribe settlement updates for the same premium bucket, but A adds actual credits while B adds committed credits. B explicitly states that committed credits are capped at the reserve when overshoot exceeds the tolerance and that using actual credits is incorrect in that case. Thus the updates differ when overshoot capping applies; A states no exception for that case.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 2218, "line_end": 2218, "quote": "If the turn ran on premium tier (bucket `tier:premium`): `reserved_credits_micro -= turn_reserved_credits_micro; spent_credits_micro += turn_actual_credits_micro; calls += 1`.", "text": [[2217, "  - Always (bucket `total`): `reserved_credits_micro -= turn_reserved_credits_micro; spent_credits_micro += turn_actual_credits_micro; calls += 1; input_tokens += actual_input_tokens; output_tokens += actual_output_tokens; file_search_calls += turn_file_search_calls; web_search_calls += turn_web_search_calls; code_interpreter_calls += turn_code_interpreter_calls`."], [2218, "  - If the turn ran on premium tier (bucket `tier:premium`): `reserved_credits_micro -= turn_reserved_credits_micro; spent_credits_micro += turn_actual_credits_micro; calls += 1`."], [2219, "  - Token telemetry counters (`input_tokens`, `output_tokens`) are updated only in bucket `total`."]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#table-quota_usage", "title": "Table: quota_usage", "line": 2178}}, {"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 5313, "line_end": 5313, "quote": "- **If turn ran on premium tier (bucket `tier:premium`)**: `spent_credits_micro += committed_credits_micro; reserved_credits_micro -= turn_reserved_credits_micro; calls += 1`", "text": [[5312, "   - **Always (bucket `total`)**: `spent_credits_micro += committed_credits_micro; reserved_credits_micro -= turn_reserved_credits_micro; calls += 1; input_tokens += actual_input_tokens; output_tokens += actual_output_tokens`"], [5313, "   - **If turn ran on premium tier (bucket `tier:premium`)**: `spent_credits_micro += committed_credits_micro; reserved_credits_micro -= turn_reserved_credits_micro; calls += 1`"], [5314, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#544-finalization-settlement", "title": "Finalization Settlement", "line": 5258}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "cbbbc6d647f58c33", "rule": "contradiction.value", "gate": "advise", "subject": "userlimit cache / key: DESIGN.md:4822 vs DESIGN.md:7123", "message": "Both passages specify the current MiniChat UserLimits cache key, but A requires tenant_id as a key component while B specifies only user_id and policy_version. Neither passage marks its key as historical, proposed, or for a separate cache, so an implementer must choose between the two key definitions.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 4822, "line_end": 4822, "quote": "Cache key: `(tenant_id, user_id, policy_version)`.", "text": [[4821, "- UserLimits MAY be cached in memory for hot-path performance."], [4822, "- Cache key: `(tenant_id, user_id, policy_version)`."], [4823, "- The cache MUST be bounded (LRU or equivalent eviction strategy)."]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#528-local-policy-and-limits-caching-normative", "title": "Local Policy and Limits Caching (Normative)", "line": 4808}}, {"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 7123, "line_end": 7123, "quote": "- User limits: Bounded LRU cache with 60–300 second TTL; key by `(user_id, policy_version)`.", "text": [[7122, "- Policy snapshots: Persist by `(user_id, policy_version)`; bounded LRU memory cache."], [7123, "- User limits: Bounded LRU cache with 60–300 second TTL; key by `(user_id, policy_version)`."], [7124, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#a4-policy-version-retention", "title": "A.4 Policy Version Retention", "line": 7117}}], "gear": "gears/mini-chat", "source": "llm:local-main+cloud-mini>cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "0c662a6cc3909e59", "rule": "contradiction.value", "gate": "advise", "subject": "quota exceeded / http status and quota scope: DESIGN.md:1132 vs PRD.md:1065", "message": "Both specify HTTP 429, so the status does not conflict. The quota-scope contracts differ: A requires `code_interpreter` for exhausted daily code interpreter quotas, while B lists only four alternatives and excludes that value. Both describe the current error contract, so an implementation returning `code_interpreter` would satisfy A but fall outside B's stated alternatives.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 1132, "line_end": 1132, "quote": "| `quota_exceeded` | 429 | Quota exhaustion. Always accompanied by a `quota_scope` field: `\"tokens\"` (token rate limits across all tiers exhausted, emergency flags, or all models disabled), `\"uploads\"` (daily upload quota exceeded for the attachment endpoint), `\"web_search\"` (per-user daily web search call quota exhausted), `\"code_interpreter\"` (per-user daily code interpreter call quota exhausted), or `\"image_inputs\"` (per-turn or per-day image input limit exceeded). |", "text": [[1131, "| `request_id_conflict` | 409 | The same `(chat_id, request_id)` is already in a non-replayable state (`running`, `failed`, or `cancelled`). Always pre-stream JSON. |"], [1132, "| `quota_exceeded` | 429 | Quota exhaustion. Always accompanied by a `quota_scope` field: `\"tokens\"` (token rate limits across all tiers exhausted, emergency flags, or all models disabled), `\"uploads\"` (daily upload quota exceeded for the attachment endpoint), `\"web_search\"` (per-user daily web search call quota exhausted), `\"code_interpreter\"` (per-user daily code interpreter call quota exhausted), or `\"image_inputs\"` (per-turn or per-day image input limit exceeded). |"], [1133, "| `web_search_disabled` | 400 | Request includes `web_search.enabled=true` but the global `disable_web_search` kill switch is active |"]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#provider-event-translation", "title": "Provider Event Translation", "line": 1083}}, {"path": "gears/mini-chat/docs/PRD.md", "line_start": 1065, "line_end": 1065, "quote": "| `quota_exceeded` | 429 | Quota exhaustion. Always accompanied by `quota_scope`: `\"tokens\"` (token rate limits across all tiers exhausted, emergency flags, or all models disabled), `\"uploads\"` (daily upload quota exceeded), `\"web_search\"` (per-user daily web search call quota exhausted), or `\"image_inputs\"` (per-turn or per-day image input limit exceeded) |", "text": [[1064, "| `not_latest_turn` | 409 | Target `request_id` is not the most recent non-deleted turn; retry/edit/delete mutations apply only to the latest turn |"], [1065, "| `quota_exceeded` | 429 | Quota exhaustion. Always accompanied by `quota_scope`: `\"tokens\"` (token rate limits across all tiers exhausted, emergency flags, or all models disabled), `\"uploads\"` (daily upload quota exceeded), `\"web_search\"` (per-user daily web search call quota exhausted), or `\"image_inputs\"` (per-turn or per-day image input limit exceeded) |"], [1066, "| `rate_limited` | 429 | Provider upstream throttling (provider 429 after OAGW retry exhaustion) |"]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#sse-streaming-contract", "title": "SSE Streaming Contract", "line": 1040}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "path": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "beca441ad07aa822", "rule": "contradiction.value", "gate": "advise", "subject": "ccm / use of outbox actual credit micro: DESIGN.md:5049 vs DESIGN.md:5438", "message": "The conflict concerns which outbox field CCM must consume as authoritative, not different numeric values. A mandates using `actual_credits_micro` directly, while B mandates `committed_credits_micro` and relegates the former to legacy compatibility. Although B requires both fields to contain the same value in P1, an implementer must still choose between incompatible field-selection instructions.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 5049, "line_end": 5049, "quote": "CCM MUST use the emitted `actual_credits_micro` value directly and MUST NOT recompute it.", "text": [[5048, ""], [5049, "In all cases `settlement_method` and (for capped overshoot) `overshoot_capped: true` provide context for the value. CCM MUST use the emitted `actual_credits_micro` value directly and MUST NOT recompute it."], [5050, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#531-reserve-vs-settlement-variables-canonical-glossary", "title": "Reserve vs Settlement Variables (Canonical Glossary)", "line": 5006}}, {"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 5438, "line_end": 5438, "quote": "**Emit `committed_credits_micro` as an explicit mandatory field** alongside `actual_credits_micro`. This is the authoritative billing amount.", "text": [[5437, "      - Emit COMMITTED credits: `actual_credits_micro` field contains `committed_credits_micro` (confusing name, intentional for backward compat — do NOT rename; see migration note)"], [5438, "      - **Emit `committed_credits_micro` as an explicit mandatory field** alongside `actual_credits_micro`. This is the authoritative billing amount. Downstream consumers (CCM) MUST use `committed_credits_micro` as the definitive charge; `actual_credits_micro` is retained for legacy compatibility only."], [5439, "      - Emit ACTUAL tokens for telemetry: `usage.input_tokens`, `usage.output_tokens`"]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#545-exceedance-handling", "title": "Exceedance Handling", "line": 5346}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "c4424034fc093fa0", "rule": "contradiction.value", "gate": "advise", "subject": "mcp server auth type / allowed value: DESIGN.md:2311 vs PRD.md:635", "message": "Passage A limits the MCP server auth_type to four values, reinforced by its CHECK constraint. Passage B requires a fifth, distinct authentication method, OAuth2AuthorizationCode, in addition to OAuth2 client credentials. The registry schema cannot represent that required method as specified. This is not merely a naming difference, and neither passage marks the additional method as future or out of scope.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 2311, "line_end": 2311, "quote": "| auth_type | TEXT | `none`, `bearer`, `api_key`, `oauth2` |", "text": [[2310, "| description | TEXT | Server description (default: empty) |"], [2311, "| auth_type | TEXT | `none`, `bearer`, `api_key`, `oauth2` |"], [2312, "| auth_config | JSONB | Full auth configuration per `auth_type`; keys depend on type: `Bearer` → `{secret_ref}`, `ApiKey` → `{header, secret_ref}`, `OAuth2` → `{client_id_ref, client_secret_ref, token_url, scopes}`; NULL for `auth_type='none'` |"]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#table-mcp_servers", "title": "Table: mcp_servers", "line": 2297}}, {"path": "gears/mini-chat/docs/PRD.md", "line_start": 635, "line_end": 635, "quote": "the system MUST support multiple authentication methods for MCP servers: `None`, `Bearer` (token), `ApiKey` (custom header + value), `OAuth2` (client-credentials flow), and `OAuth2AuthorizationCode` (interactive per-user authorization-code flow).", "text": [[634, ""], [635, "**Authentication**: the system MUST support multiple authentication methods for MCP servers: `None`, `Bearer` (token), `ApiKey` (custom header + value), `OAuth2` (client-credentials flow), and `OAuth2AuthorizationCode` (interactive per-user authorization-code flow). Auth credentials MUST be resolved via credstore through OAGW's built-in auth plugins — mini-chat does NOT resolve secrets or manage tokens directly. Instead, when registering the OAGW upstream, mini-chat maps the MCP auth configuration to the corresponding OAGW auth plugin:"], [636, ""]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#mcp-server-registry", "title": "MCP Server Registry", "line": 601}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "path": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "2ff19d0200f56008", "rule": "contradiction.value", "gate": "advise", "subject": "thread summary trigger / compression threshold: README.md:52 vs phase-4-trigger.md:31", "message": "Both passages prescribe the compression threshold for the same thread-summary trigger in the finalization path. A specifies 80%, while B specifies a 60% default. Neither labels the other value historical or superseded, and the text provides no budget conversion that reconciles them. An implementer would have to choose which threshold to use.", "locations": [{"path": "gears/mini-chat/docs/plans/thread-summary-worker/README.md", "line_start": 52, "line_end": 54, "quote": "against the compression threshold\n   (`80% of token_budget`). If exceeded, a durable outbox message is enqueued in the same\n   transaction as the turn's CAS finalization.", "text": [[51, "- **Trigger in finalization path** — the trigger evaluates the assembled request's"], [52, "  `reserve_tokens` (already computed during preflight) against the compression threshold"], [53, "  (`80% of token_budget`). If exceeded, a durable outbox message is enqueued in the same"], [54, "  transaction as the turn's CAS finalization. This ensures atomicity per DESIGN.md."], [55, ""]], "section": {"id": "sec:gears/mini-chat/docs/plans/thread-summary-worker/README.md#architecture-decisions", "title": "Architecture Decisions", "line": 41}}, {"path": "gears/mini-chat/docs/plans/thread-summary-worker/phase-4-trigger.md", "line_start": 31, "line_end": 31, "quote": "- Default compression threshold: **60%** of effective input token budget.", "text": [[30, "- When a summary already exists and context is not truncated, trigger MUST NOT fire."], [31, "- Default compression threshold: **60%** of effective input token budget."], [32, "- Durable scheduling MUST occur only in the same transaction that makes the causing turn durable."]], "section": {"id": "sec:gears/mini-chat/docs/plans/thread-summary-worker/phase-4-trigger.md#design-constraints", "title": "Design Constraints", "line": 22}}], "gear": "gears/mini-chat", "source": "llm:local-main+cloud-mini>cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/plans/thread-summary-worker/README.md", "gears/mini-chat/docs/plans/thread-summary-worker/phase-4-trigger.md"], "path": ["gears/mini-chat/docs/plans/thread-summary-worker/README.md", "gears/mini-chat/docs/plans/thread-summary-worker/phase-4-trigger.md"], "hops": 1, "section_linked": false}, {"fingerprint": "8f2cfa32f3eb2773", "rule": "contradiction.decision", "gate": "advise", "subject": "mini chat quota preflight total / type and label: DESIGN.md:4102 vs PRD.md:845", "message": "The active metric contracts specify different label sets for the same metric: DESIGN requires `tier`, while PRD lists only `decision` ttlement details, and provider internals are not exposed via this endpoint in P1."], [870, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#turn-status-api--id-cpt-cf-mini-chat-interface-turn-status", "title": "Turn Status API — **ID**: `cpt-cf-mini-chat-interface-turn-status`", "line": 855}}, {"path": "gears/mini-chat/docs/PRD.md", "line_start": 1005, "line_end": 1005, "quote": "- `updated_at`", "text": [[1004, "- `assistant_message_id` (nullable UUID) — persisted assistant message ID when `state` is `done`. Null while running, on error, or on cancellation. Allows clients to fetch the assistant message directly via `GET /v1/chats/{id}/messages?$filter=id eq '{assistant_message_id}'` without scanning full history."], [1005, "- `updated_at`"], [1006, ""]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#turn-status-read-only-api", "title": "Turn Status (read-only) API", "line": 991}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "path": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "e22e70fc86f8301c", "rule": "contradiction.value", "gate": "advise", "subject": "quota scope / allowed value: DESIGN.md:1031 vs PRD.md:1065", "message": "Both passages define the current quota_exceeded error contract. A permits five quota_scope values, including code_interpreter, while B lists only four alternatives and omits code_interpreter. Because the SSE error uses the same envelope as JSON errors, this is not a distinction between separate APIs; implementers must choose whether code_interpreter is an allowed value.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 1031, "line_end": 1031, "quote": "`quota_scope` | `\"tokens\"` \\| `\"uploads\"` \\| `\"web_search\"` \\| `\"code_interpreter\"` \\| `\"image_inputs\"` | **Required** when `code = \"quota_exceeded\"`; MUST be absent otherwise. Clients MUST use this field, not `message` parsing, to determine quota scope.", "text": [[1030, "| `message` | string | Human-readable description. |"], [1031, "| `quota_scope` | `\"tokens\"` \\| `\"uploads\"` \\| `\"web_search\"` \\| `\"code_interpreter\"` \\| `\"image_inputs\"` | **Required** when `code = \"quota_exceeded\"`; MUST be absent otherwise. Clients MUST use this field, not `message` parsing, to determine quota scope. |"], [1032, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#event-error", "title": "`event: error`", "line": 1018}}, {"path": "gears/mini-chat/docs/PRD.md", "line_start": 1065, "line_end": 1065, "quote": "| `quota_exceeded` | 429 | Quota exhaustion. Always accompanied by `quota_scope`: `\"tokens\"` (token rate limits across all tiers exhausted, emergency flags, or all models disabled), `\"uploads\"` (daily upload quota exceeded), `\"web_search\"` (per-user daily web search call quota exhausted), or `\"image_inputs\"` (per-turn or per-day image input limit exceeded) |", "text": [[1064, "| `not_latest_turn` | 409 | Target `request_id` is not the most recent non-deleted turn; retry/edit/delete mutations apply only to the latest turn |"], [1065, "| `quota_exceeded` | 429 | Quota exhaustion. Always accompanied by `quota_scope`: `\"tokens\"` (token rate limits across all tiers exhausted, emergency flags, or all models disabled), `\"uploads\"` (daily upload quota exceeded), `\"web_search\"` (per-user daily web search call quota exhausted), or `\"image_inputs\"` (per-turn or per-day image input limit exceeded) |"], [1066, "| `rate_limited` | 429 | Provider upstream throttling (provider 429 after OAGW retry exhaustion) |"]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#sse-streaming-contract", "title": "SSE Streaming Contract", "line": 1040}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "path": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "5b63564c34289b4c", "rule": "contradiction.value", "gate": "advise", "subject": "provider request / code interpreter inclusion: DESIGN.md:1397 vs DESIGN.md:3056", "message": "The passages give different inclusion conditions for the same provider tool. A requires both explicit enablement and ready code_interpreter attachments, whereas B says enabling it causes the backend to include it, without requiring attachments. With the tool enabled, no ready attachments, and the kill switch inactive, the two rules prescribe different behavior. Both passages agree on the kill-switch exception in their surrounding context.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 1397, "line_end": 1397, "quote": "code_interpreter included when code_interpreter.enabled=true and chat has ready code_interpreter attachments (unless disable_code_interpreter kill switch active).", "text": [[1396, ""], [1397, "    Note over CS, OAI: Single provider call per user turn. file_search tool always included when chat has ready document attachments; retrieval scope = entire chat vector store. web_search included when web_search.enabled=true. code_interpreter included when code_interpreter.enabled=true and chat has ready code_interpreter attachments (unless disable_code_interpreter kill switch active)."], [1398, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#send-message-with-streaming-response", "title": "Send Message with Streaming Response", "line": 1345}}, {"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 3056, "line_end": 3056, "quote": "Code interpreter is an explicitly-enabled tool available when `code_interpreter.enabled=true` on the send-message request.", "text": [[3055, ""], [3056, "Code interpreter is an explicitly-enabled tool available when `code_interpreter.enabled=true` on the send-message request. The backend includes the `code_interpreter` tool in the Responses API request; the provider decides whether to invoke it."], [3057, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#code-interpreter-configuration", "title": "Code Interpreter Configuration", "line": 3052}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "6b207456e2aefc3b", "rule": "contradiction.value", "gate": "advise", "subject": "quota preflight estimate / token usage estimate input: DESIGN.md:379 vs DESIGN.md:2912", "message": "Both prescribe the input to the same current quota reservation calculation. A uses the last completed turn's actual token usage plus the current message as its input estimate; B uses the final truncated ContextPlan plus surcharges. Truncation and changes in included context can make these amounts differ, so B is not merely adding detail to A's formula. An implementation must choose which basis determines the reserve.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 379, "line_end": 379, "quote": "estimate token usage from current message size + `prior_context_tokens` (actual `input_tokens + output_tokens` from the last completed turn, representing the conversation history that will be re-sent) + `max_output_tokens`", "text": [[378, ""], [379, "  - **Phase 1 - Preflight (reserve) estimate** (on request start, before any streaming begins and before outbound call): estimate token usage from current message size + `prior_context_tokens` (actual `input_tokens + output_tokens` from the last completed turn, representing the conversation history that will be re-sent) + `max_output_tokens` (persisted as `max_output_tokens_applied`), convert to reserved credits using model multipliers (section 5.4.1), and reserve credits for quota enforcement. Decision: allow at requested tier / downgrade to next tier / reject if all tiers exhausted."], [380, "    - Reserve MUST prevent parallel requests from overspending remaining tier quota."]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#32-component-model", "title": "Component Model", "line": 324}}, {"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 2912, "line_end": 2912, "quote": "the token estimate used for quota reservation (section 5.4.1) is computed from the final truncated `ContextPlan` size (plus surcharges) as `estimated_input_tokens`, combined with `max_output_tokens_applied` to form `reserve_tokens`.", "text": [[2911, ""], [2912, "**Link to quota preflight**: the token estimate used for quota reservation (section 5.4.1) is computed from the final truncated `ContextPlan` size (plus surcharges) as `estimated_input_tokens`, combined with `max_output_tokens_applied` to form `reserve_tokens`."], [2913, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#context-plan-truncation-algorithm", "title": "Context Plan Truncation Algorithm", "line": 2882}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "1d6f850c0b688f40", "rule": "contradiction.value", "gate": "advise", "subject": "mcp server provisioning / configuration source: DESIGN.md:3274 vs PRD.md:605", "message": "Both passages describe current P1 provisioning, but A identifies role-level access as the second way to define servers, whereas B identifies manual admin registration. B explicitly distinguishes role grants from provisioning: the join table governs visibility of already registered servers. Implementers must choose whether role grants define servers or only grant access to them.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 3274, "line_end": 3274, "quote": "MCP servers can be defined in two complementary ways: (a) application config (`mcp.servers[]`) and (b) role-level access (`role_mcp_servers` join table).", "text": [[3273, ""], [3274, "1. **Policy-controlled server provisioning** — MCP servers can be defined in two complementary ways: (a) application config (`mcp.servers[]`) and (b) role-level access (`role_mcp_servers` join table). At stream time, `EffectiveMcpResolver` merges config-defined, hub-discovered, and role-granted servers, then applies tenant/role/model/tool policy. This follows the enterprise pattern of binding tools to a workspace or user role rather than individual chats."], [3275, ""]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#key-decisions", "title": "Key Decisions", "line": 3272}}, {"path": "gears/mini-chat/docs/PRD.md", "line_start": 605, "line_end": 605, "quote": "In P1, MCP servers can be provisioned from two sources: (a) **application config** — servers listed in `mcp.servers[]` are registered by operators and may be auto-enabled depending on policy, and (b) **manual admin registration** (`source='manual'`) — administrators register servers directly via the admin REST API.", "text": [[604, ""], [605, "The system MUST maintain a tenant-scoped registry of available MCP servers. In P1, MCP servers can be provisioned from two sources: (a) **application config** — servers listed in `mcp.servers[]` are registered by operators and may be auto-enabled depending on policy, and (b) **manual admin registration** (`source='manual'`) — administrators register servers directly via the admin REST API. Role-level access — administrators assign MCP servers to user roles via the `role_mcp_servers` join table; at stream time only servers granted to the requesting user's role(s) are included in the effective set — governs visibility of registered servers (see `cpt-cf-mini-chat-fr-mcp-role-access`). A third source, **hub discovery** (`source='hub'`), is deferred to P2 (see `cpt-cf-mini-chat-fr-mcp-hub-discovery`); the `mcp_servers` schema reserves `source='hub'` so hub-discovered rows can be ingested without a migration when that requirement lands."], [606, ""]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#mcp-server-registry", "title": "MCP Server Registry", "line": 601}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "path": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "a82fbad4353c8bf3", "rule": "contradiction.value", "gate": "advise", "subject": "thread summary trigger / default compression threshold: DESIGN.md:1599 vs PRD.md:1435", "message": "Both passages specify current thread-summary triggers. B requires compression based on message or turn counts independently of token pressure. A forbids triggering when a summary exists and no messages are truncated, and permits count heuristics only to prompt token re-estimation. Thus, at 15 user turns with an existing summary and no truncation, B requires a trigger while A prohibits it. This is a trigger-policy conflict, not merely a difference in default threshold values.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 1599, "line_end": 1599, "quote": "Default threshold: **80%**.", "text": [[1598, ""], [1599, "1. **Proactive (first summary):** `assembled_context_tokens >= compression_threshold_pct% of effective_budget` AND no existing summary. Default threshold: **80%**."], [1600, "2. **Urgent (re-summarize):** Context assembly had to truncate (drop) older messages (`messages_truncated = true`). This means the existing summary is stale and the conversation is losing context."]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#trigger-timing", "title": "Trigger timing", "line": 1579}}, {"path": "gears/mini-chat/docs/PRD.md", "line_start": 1435, "line_end": 1435, "quote": "compression triggers when message count exceeds 20, token count exceeds budget, or every 15 user turns", "text": [[1434, "- [ ] Every completed chat turn emits a structured audit event to platform `audit_service` (one event per completed turn) including usage metrics"], [1435, "- [ ] Long conversations (50+ turns) remain functional via thread summary compression; compression triggers when message count exceeds 20, token count exceeds budget, or every 15 user turns (see DESIGN.md `cpt-cf-mini-chat-seq-thread-summary` for threshold details)"], [1436, "- [ ] User can retry, edit, or delete the last turn; operations on non-latest turns are rejected with `409 Conflict`"]], "section": {"id": "sec:gears/mini-chat/docs/PRD.md#9-acceptance-criteria", "title": "Acceptance Criteria", "line": 1419}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "path": ["gears/mini-chat/docs/DESIGN.md", "gears/mini-chat/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "6da1ada8003c2e22", "rule": "contradiction.value", "gate": "advise", "subject": "policysnapshot / persistence key: DESIGN.md:4801 vs DESIGN.md:4813", "message": "Both are current requirements for persisting the same PolicySnapshot, but A requires a composite tenant-and-version key while B specifies a version-only key. Neither passage identifies a separate storage layer or explicitly makes tenant scope implicit in B, so they prescribe different persistence keys.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 4801, "line_end": 4801, "quote": "Mini Chat MUST persist the fetched snapshot in DB keyed by `(tenant_id, policy_version)`.", "text": [[4800, "2. Mini Chat SHOULD fetch the PolicySnapshot for that version via `GetPolicySnapshot(user_id, policy_version)` when a suitable `user_id` for that tenant is available (for example, on the next user request handled for that tenant)."], [4801, "3. Mini Chat MUST persist the fetched snapshot in DB keyed by `(tenant_id, policy_version)`."], [4802, "4. Mini Chat MUST atomically switch `current_policy_version` in memory to the new version."]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#527-policy-version-resolution-and-bootstrap", "title": "Policy Version Resolution and Bootstrap", "line": 4781}}, {"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 4813, "line_end": 4813, "quote": "PolicySnapshot MUST be persisted in DB keyed by `policy_version`.", "text": [[4812, "- PolicySnapshot MUST be cached in memory."], [4813, "- PolicySnapshot MUST be persisted in DB keyed by `policy_version`."], [4814, "- The in-memory cache MUST be bounded (LRU or equivalent eviction strategy)."]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#528-local-policy-and-limits-caching-normative", "title": "Local Policy and Limits Caching (Normative)", "line": 4808}}], "gear": "gears/mini-chat", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/mini-chat/docs/DESIGN.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "75961bdba3b70784", "rule": "contradiction.value", "gate": "advise", "subject": "turn status endpoint / backed by: DESIGN.md:857 vs PRD.md:1012", "message": "The flagged backing-store and state-mapping statements are compatible. However, the passages conflict on the same endpoint's cancellation response: A requires assistant_message_id correct in that case. Thus the two rules require different increments when overshoot capping applies.", "locations": [{"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 2217, "line_end": 2217, "quote": "Always (bucket `total`): `reserved_credits_micro -= turn_reserved_credits_micro; spent_credits_micro += turn_actual_credits_micro; calls += 1; input_tokens += actual_input_tokens; output_tokens += actual_output_tokens; file_search_calls += turn_file_search_calls; web_search_calls += turn_web_search_calls; code_interpreter_calls += turn_code_interpreter_calls`.", "text": [[2216, "- **At settlement (commit)**:"], [2217, "  - Always (bucket `total`): `reserved_credits_micro -= turn_reserved_credits_micro; spent_credits_micro += turn_actual_credits_micro; calls += 1; input_tokens += actual_input_tokens; output_tokens += actual_output_tokens; file_search_calls += turn_file_search_calls; web_search_calls += turn_web_search_calls; code_interpreter_calls += turn_code_interpreter_calls`."], [2218, "  - If the turn ran on premium tier (bucket `tier:premium`): `reserved_credits_micro -= turn_reserved_credits_micro; spent_credits_micro += turn_actual_credits_micro; calls += 1`."]], "section": {"id": "sec:gears/mini-chat/docs/DESIGN.md#table-quota_usage", "title": "Table: quota_usage", "line": 2178}}, {"path": "gears/mini-chat/docs/DESIGN.md", "line_start": 5313, "line_end": 5313, "quote": "- **If turn ran on premium tier (bucket `tier:premium`)**: `spent_credits_micro += committed_credits_micro; reserved_credits_micro -= turn_reserved_credits_micro; calls += 1`", "text": [[5312, "   - **Always (bucket `total`)**: `spent_credits_micro += committed_credits_micro; reserved_credits_micro -= turn_reserved_credits_micro; calls += 1; input_tokens += actual_input_tokens; output_tokens += actual_output_tokens`"], [5313, "   - **If turn ran on premium tier (bucket `tier:premium`)**: `spent_credits_micro += committed_credits_micro; reserved_credits_micro -= turn_reserved_credits_micr ltipart) — not by user or operator choice."], [55, ""]], "section": {"id": "sec:gears/file-storage/docs/ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md#context-and-problem-statement", "title": "Context and Problem Statement", "line": 36}}], "gear": "gears/file-storage", "source": "llm:local-main+cloud-mini@contradiction-judge/2", "suggestion": null, "title": "An earlier decision record still reads as current", "origin": "corpus", "docs": ["gears/file-storage/docs/ADR/0002-cpt-cf-file-storage-adr-content-hash-selection.md", "gears/file-storage/docs/ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md"], "path": ["gears/file-storage/docs/ADR/0002-cpt-cf-file-storage-adr-content-hash-selection.md", "gears/file-storage/docs/ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md"], "hops": 1, "section_linked": false}, {"fingerprint": "e04c80223be9a934", "rule": "contradiction.value", "gate": "advise", "subject": "expired multipart session version / reclamation timing: retention-cleanup.md:342 vs operations.md:190", "message": "A says the expired session must first be transitioned out of in_progress by step 2, after which step 1 reclaims its version in the same sweep call. B specifies that step 1 runs before step 2 and that step 2 itself deletes the pending version after aborting the session. These prescribe incompatible ordering and responsibility for reclaiming the same version.", "locations": [{"path": "gears/file-storage/docs/features/retention-cleanup.md", "line_start": 342, "line_end": 345, "quote": "A session whose `expires_at` has **already passed** is deliberately **not** excluded by this guard — that\nversion becomes reclaimable, but only after [Sweep Expired Multipart\nSessions](#sweep-expired-multipart-sessions) (step 2, running in the same cycle) has transitioned the session out of\n`in_progress`;", "text": [[341, "than `orphan_grace_secs`, and without this guard the sweep would delete the version out from under the in-progress"], [342, "upload. A session whose `expires_at` has **already passed** is deliberately **not** excluded by this guard — that"], [343, "version becomes reclaimable, but only after [Sweep Expired Multipart"], [344, "Sessions](#sweep-expired-multipart-sessions) (step 2, running in the same cycle) has transitioned the session out of"], [345, "`in_progress`; step 1 and step 2 run in a fixed order within one `run_sweep` call, so a session that expires exactly"], [346, "between them is reclaimed on the *next* cycle, not silently missed. The same live-session check is repeated,"]], "section": {"id": "sec:gears/file-storage/docs/features/retention-cleanup.md#live-multipart-session-guard-p2-remediation-28", "title": "Live-Multipart-Session Guard (P2 Remediation 2.8)", "line": 330}}, {"path": "gears/file-storage/docs/operations.md", "line_start": 190, "line_end": 191, "quote": "aborts `multipart_uploads` sessions still `in_progress` whose `expires_at` has passed:", "text": [[189, "   sweep step; it is folded into step 1's per-version cleanup."], [190, "2. **Expired-multipart sweep** — aborts `multipart_uploads` sessions still `in_progress` whose `expires_at` has"], [191, "   passed: wins the session's own `in_progress → aborted` CAS first (racing a concurrent `complete`/user-`abort`),"], [192, "   and only on winning that race does it tell the backend to discard the in-progress upload and delete the"]], "section": {"id": "sec:gears/file-storage/docs/operations.md#the-background-cleanup-sweep", "title": "The background cleanup sweep", "line": 174}}], "gear": "gears/file-storage", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/file-storage/docs/features/retention-cleanup.md", "gears/file-storage/docs/operations.md"], "path": ["gears/file-storage/docs/features/retention-cleanup.md", "gears/file-storage/docs/DESIGN.md", "gears/file-storage/docs/operations.md"], "hops": 2, "section_li       `${l.section ? `<div class="meta" style="padding:4px 10px 0">§ ${esc(l.section.title)}</div>` : ""}<pre>${lines || esc(l.quote || "")}</pre></div>`;
  }).join("");
  const sugg = f.suggestion ? `<p class="sub">Suggested replacement for ${esc(short(f.suggestion.path))}:${f.suggestion.line_start}</p><pre class="sugg">${esc(f.suggestion.text)}</pre>` : "";
  $("#panel").innerHTML = `<button class="back" id="back">← back</button>` +
    `<div style="display:flex;flex-wrap:wrap;gap:6px"><span class="pill ${gate}">${mark(gate)} ${gate === "block" ? "blocking" : "advisory"}</span>${hopsPill}${secPill}</div>` +
    `<h2>${esc(f.title)}</h2><p class="meta">${esc(f.rule)} · ${esc(f.source)} · ${esc(f.fingerprint)}</p>` +
    `<p class="msg">${esc(f.message)}</p><div class="quotes">${quotes}</div>${sugg}`;
  $("#back").addEventListener("click", () => { history.length > 1 ? history.back() : (location.hash = "map"); });
}

function route() {
  const h = location.hash.slice(1);
  $("#nav-map").removeAttribute("aria-current"); $("#nav-pr").removeAttribute("aria-current");
  if (h.startsWith("f-")) return showFinding(h.slice(2));
  const pr = h === "pr" || (!h && (DATA.meta.pr || DATA.changed.length));
  $(pr ? "#nav-pr" : "#nav-map").setAttribute("aria-current", "page");
  showMap(pr);
}
window.addEventListener("hashchange", route);
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => cy && cy.style(style()));
route();
</script>

</body></html>

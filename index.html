<style>
/* Layout: a working tool. Header with the revision and the metric; the graph fills the left, the
   reading panel the right (stacked on phones). Findings keep two cues besides colour:
   blocking = magenta, solid ring, ■ ; advisory = blue, dashed ring, ◆ ; changed by the PR = amber, ✎. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --ink-2: #4a5160; --ink-3: #7b8292; --rule: #dde1e8;
  --gear: #eceff4; --gear-ink: #5d6575; --doc: #ffffff; --doc-line: #9aa3b2; --edge: #b8bfcc;
  --block: #b4246f; --block-soft: #f7e3ee; --advise: #2463c9; --advise-soft: #e3ecfa;
  --changed: #c78f00; --changed-soft: #fbf1d6; --hl: #fff4c2;
  --f-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121419; --panel: #1a1d24; --ink: #e9ecf2; --ink-2: #b3bac8; --ink-3: #868ea0; --rule: #2c313b;
  --gear: #1f232b; --gear-ink: #9aa2b3; --doc: #262a33; --doc-line: #5c6475; --edge: #4a5161;
  --block: #ec6aa9; --block-soft: #3a1d2c; --advise: #6ea2f2; --advise-soft: #1b2a44;
  --changed: #e6b437; --changed-soft: #3a3016; --hl: #3b3517; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121419; --panel: #1a1d24; --ink: #e9ecf2; --ink-2: #b3bac8; --ink-3: #868ea0; --rule: #2c313b;
  --gear: #1f232b; --gear-ink: #9aa2b3; --doc: #262a33; --doc-line: #5c6475; --edge: #4a5161;
  --block: #ec6aa9; --block-soft: #3a1d2c; --advise: #6ea2f2; --advise-soft: #1b2a44;
  --changed: #e6b437; --changed-soft: #3a3016; --hl: #3b3517; color-scheme: dark }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
.app { display: flex; flex-direction: column; height: 100%; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 12px; box-sizing: border-box }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px }
h1 { font: 600 20px/1.2 var(--f-display); margin: 0; text-wrap: balance }
.meta { color: var(--ink-3); font: 12px var(--f-mono) }
nav { display: flex; gap: 4px; margin-left: auto }
nav a { color: var(--ink-2); text-decoration: none; padding: 4px 10px; border-radius: 6px; font-weight: 500 }
nav a[aria-current="page"] { background: var(--ink); color: var(--bg) }
nav a:focus-visible, button:focus-visible, .item:focus-visible { outline: 2px solid var(--advise); outline-offset: 2px }
.metric { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 13px }
.metric b { font: 600 15px var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2) }
.legend span::before { margin-right: 4px }
.lg-block::before { content: "■"; color: var(--block) } .lg-advise::before { content: "◆"; color: var(--advise) }
.lg-changed::before { content: "✎"; color: var(--changed) } .lg-link::before { content: "—"; color: var(--ink-3) }
.lg-cite::before { content: "┄"; color: var(--ink-3) }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); gap: 12px }
.canvas { position: relative; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; min-height: 380px; overflow: hidden }
#cy { position: absolute; inset: 0 }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--ink-3); pointer-events: none }
aside { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: auto; min-width: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px }
aside h2 { font: 600 15px/1.3 var(--f-display); margin: 0; text-wrap: balance }
.sub { color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 0 }
.list { display: flex; flex-direction: column; gap: 6px }
.item { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--rule); cursor: pointer; text-align: left; background: none; color: inherit; font: inherit }
.item:hover { background: var(--bg) }
.item .mk { font-size: 13px; line-height: 1.5 } .item.block .mk { color: var(--block) } .item.advise .mk { color: var(--advise) }
.item .t { font-weight: 500 } .item .w { grid-column: 2; color: var(--ink-3); font: 12px var(--f-mono); overflow-wrap: anywhere }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px }
.pill.block { background: var(--block-soft); color: var(--block) } .pill.advise { background: var(--advise-soft); color: var(--advise) }
.pill.hops { background: var(--bg); color: var(--ink-2); border: 1px solid var(--rule) }
.msg { color: var(--ink-2); margin: 0; max-width: 65ch }
.quotes { display: grid; grid-template-columns: 1fr; gap: 10px }
.quote { border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; min-width: 0 }
.quote header { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; background: var(--bg); font: 12px var(--f-mono); color: var(--ink-2) }
.quote header a { color: var(--advise) }
.quote pre { margin: 0; padding: 6px 0; overflow-x: auto; font: 12px/1.55 var(--f-mono) }
.quote .ln { display: block; padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere }
.quote .ln.on { background: var(--hl) }
.quote .n { display: inline-block; width: 3.2em; color: var(--ink-3); user-select: none; font-variant-numeric: tabular-nums }
.sugg { font: 12px/1.5 var(--f-mono); background: var(--bg); border: 1px dashed var(--rule); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 }
.empty { color: var(--ink-3) }
button.back { align-self: flex-start; background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; color: var(--ink-2); cursor: pointer; font: inherit }
@media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 55vh auto } html, body { height: auto } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<div class="app">

  <div class="legend" aria-label="Legend">

  <main>
    <div class="canvas"><div id="cy" role="img" aria-label="Graph of the documents"></div><div class="hint" id="hint"></div></div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>

gears/mini-chat/docs/features/outbox-pattern.md->cpt-cf-mini-chat-actor-outbox-consumer", "message": "cpt-cf-mini-chat-actor-outbox-consumer is not defined in mini-chat", "locations": [{"path": "gears/mini-chat/docs/features/outbox-pattern.md", "line_start": 32, "line_end": 32, "quote": null, "text": [[31, "| `cpt-cf-mini-chat-actor-usage-outbox-dispatcher` | Background worker that claims pending outbox rows and publishes events to a downstream consumer with retries. |"], [32, "| `cpt-cf-mini-chat-actor-outbox-consumer` | Downstream event consumer that processes deliveries idempotently. |"], [33, ""]], "section": {"id": "sec:gears/mini-chat/docs/features/outbox-pattern.md#13-actors", "title": "Actors", "line": 26}}], "gear": "mini-chat", "source": "deterministic", "suggestion": null, "title": "An id is used but never defined", "origin": "corpus", "docs": ["gears/mini-chat/docs/features/outbox-pattern.md"], "path": null, "hops": null, "section_linked": null}, {"fingerprint": "da6cd7fc9da5ade0", "rule": "reference.defined", "gate": "block", "subject": "gears/mini-chat/docs/features/outbox-pattern.md->cpt-cf-mini-chat-actor-usage-outbox-dispatcher", "message": "cpt-cf-mini-chat-actor-usage-outbox-dispatcher is not defined in mini-chat", "locations": [{"path": "gears/mini-chat/docs/features/outbox-pattern.md", "line_start": 31, "line_end": 201, "quote": null, "text": [[30, "| `cpt-cf-mini-chat-actor-chat-user` | Initiates an operation whose commit MUST enqueue an outbox event (when side effects are applied). |"], [31, "| `cpt-cf-mini-chat-actor-usage-outbox-dispatcher` | Background worker that claims pending outbox rows and publishes events to a downstream consumer with retries. |"], [32, "| `cpt-cf-mini-chat-actor-outbox-consumer` | Downstream event consumer that processes deliveries idempotently. |"], [33, ""], [34, "### 1.4 References"], [35, ""], [36, "- ToolKit lifecycle/stateful tasks documentation (stateful worker)"], [37, ""], [38, "### 1.5 Implementation Shape (normative)"], [39, ""], [40, "- Outbox events are enqueued through `toolkit_db::outbox::enqueue(runner, msg)` where `runner: &impl DBRunner`."], [41, "- The enqueue call MUST run inside the same DB transaction as the side effects the event describes."], [42, "- A background dispatcher (ToolKit `stateful` lifecycle task) claims events from `toolkit_outbox_events` using a lease (`locked_by`, `locked_until`) and delivers them with retries."], [43, "- Producers SHOULD provide a stable `dedupe_key` to support idempotent enqueue and idempotent downstream processing."], [44, ""], [45, "### 1.6 Outbox Storage (normative)"], [46, ""], [47, "Outbox events are stored in a shared infrastructure table owned by `toolkit-db`:"], [48, ""], [49, "`toolkit_outbox_events`"], [50, ""], [51, "**Columns (minimum)**:"], [52, ""], [53, "- `id uuid pk`"], [54, "- `namespace text not null`"], [55, "- `topic text not null`"], [56, "- `tenant_id uuid null`"], [57, "- `dedupe_key text null`"], [58, "- `payload jsonb not null`"], [59, "- `status text not null` (`pending|processing|delivered|dead`)"], [60, "- `attempts int not null default 0`"], [61, "- `next_attempt_at timestamptz not null default now()`"], [62, "- `locked_by uuid null`"], [63, "- `locked_until timestamptz null`"], [64, "- `last_error text null`"], [65, "- `created_at timestamptz not null default now()`"], [66, "- `updated_at timestamptz not null default now()` — MUST be set to `now()` by application code on every state transition (`claim`, `ack`, `nack`). Not managed by a DB trigger."], [67, ""], [68, "**Indexes (minimum)**:"], [69, ""], [70, "- `index(status, next_attempt_at)`"], [71, "- `index(locked_until)`"], [72, ""], [73, "**Dedupe / idempotency (Postgres)**:"], [74, ""], [75, "- Partial unique index on `(namespace, topic, dedupe_key)` where `dedupe_key IS NOT NULL`."], [76, ""], [77, "**`tenant_id` column vs `dedupe_key` — distinct purposes (normative)**:"], [78, ""], [79, "The `tenant_id` column and the `dedupe_key` field serve different roles and MUST NOT be conflated:"], [80, ""], [81, "- **`tenant_id` column** — used for routing, filtering, and downstream partitioning. The dispatcher MAY use it to scope claim queries to a specific tenant. Downstream consumers MAY use it for partition-aware processing. It is nullable to accommodate system-level events that are not tenant-scoped."], [82, "- **`dedupe_key`** — a producer-defined idempotency key whose structure is domain-specific. The partial unique index on `(namespace, topic, dedupe_key)` enforces at-most-once enqueue at the database level. The generic outbox library treats `dedupe_key` as an opaque string and performs NO validation on its structure."], [83, ""], [84, "**Dedupe key requiredness by event type (normative):**"], [85, ""], [86, "The generic outbox library allows `dedupe_key` to be NULL (the partial unique index only applies when `dedupe_key IS NOT NULL`). However, gears MUST follow these rules when enqueuing events:"], [87, ""], [88, "1. **Quota-bearing / billing events** — MUST have non-null `dedupe_key`"], [89, "   - Events that result in quota debit, credit, or billing charges"], [90, "   - Events that participate in financial reconciliation"], [91, "   - Examples: Mini-Chat usage snapshots, subscription charges, refunds"], [92, "   - Rationale: At-least-once delivery semantics require idempotent deduplication to prevent double-charging"], [93, ""], [94, "2. **Critical state transitions** — SHOULD have non-null `dedupe_key`"], [95, "   - Events that trigger irreversible downstream actions"], [96, "   - Events used for audit trails or compliance logging"], [97, "   - Examples: user deletion notifications, access revocations"], [98, "   - Rationale: Prevents duplicate side effects in distributed systems"], [99, ""], [100, "3. **Informational telemetry** — MAY have NULL `dedupe_key`"], [101, "   - Non-critical metrics, analytics, or monitoring events"], [102, "   - Events where duplicate delivery is acceptable"], [103, "   - Examples: page view counters, system health heartbeats"], [104, "   - Rationale: Reduces storage overhead when idempotency is not required"], [105, ""], [106, "**Mini-Chat-specific convention (not enforced by generic library):** In the Mini Chat domain, the canonical format is `\"{tenant_id}/{turn_id}/{request_id}\"` (see DESIGN.md section 5.6). Mini Chat domain code MUST validate this format and enforce non-null `dedupe_key` for all quota-bearing events before calling `enqueue`. The validation is the caller's responsibility, not the outbox library's. Mini Chat downstream consumers MUST use the same canonical tuple `(tenant_id, turn_id, request_id)` — extracted from the `dedupe_key` or from the payload — for idempotent processing. Other gears define their own `dedupe_key` format and idempotency extraction rules in their respective feature specs."], [107, ""], [108, "The presence of `tenant_id` as a table column does not replace domain-level idempotency semantics embedded in `dedupe_key`. The two serve different purposes. When both are populated, gears SHOULD ensure consistency (tenant_id column matches the tenant component of dedupe_key), but this is a gear-level convention, not a database constraint."], [109, ""], [110, "### 1.7 Proposed `toolkit_db::outbox` v1 API (sketch)"], [111, ""], [112, "This is the intended interface shape for the generalized outbox mechanism in `toolkit-db`."], [113, "Gears consume this API with their own `namespace/topic`."], [114, ""], [115, "```rust"], [116, "use toolkit_db::secure::DBRunner;"], [117, "use toolkit_db::DBProvider;"], [118, "use serde_json::Value;"], [119, "use std::time::Duration;"], [120, "use uuid::Uuid;"], [121, ""], [122, "pub struct OutboxMessage {"], [123, "    pub namespace: &'static str,"], [124, "    pub topic: &'static str,"], [125, "    pub tenant_id: Option<Uuid>,"], [126, "    pub dedupe_key: Option<String>,"], [127, "    pub payload: Value,"], [128, "}"], [129, ""], [130, "pub async fn enqueue("], [131, "    runner: &impl DBRunner,"], [132, "    msg: OutboxMessage,"], [133, ") -> Result<Uuid, toolkit_db::DbError>;"], [134, ""], [135, "pub struct ClaimCfg {"], [136, "    pub batch_size: u32,"], [137, "    pub lease_duration: Duration,"], [138, "    /// Maximum total delivery attempts (including the first)."], [139, "    /// Claim query excludes rows where `attempts >= max_attempts`."], [140, "    /// Same value used by retry logic (section 3) for dead-lettering."], [141, "    pub max_attempts: u32,"], [142, "}"], [143, ""], [144, "pub struct ClaimedMessage {"], [145, "    pub id: Uuid,"], [146, "    pub namespace: String,"], [147, "    pub topic: String,"], [148, "    pub tenant_id: Option<Uuid>,"], [149, "    pub dedupe_key: Option<String>,"], [150, "    pub payload: Value,"], [151, "    pub attempts: i32,"], [152, "}"], [153, ""], [154, "pub struct OutboxStore<E> {"], [155, "    pub db: DBProvider<E>,"], [156, "    pub worker_id: Uuid,"], [157, "    pub namespace: String,"], [158, "}"], [159, ""], [160, "impl<E> OutboxStore<E>"], [161, "where"], [162, "    E: From<toolkit_db::DbError> + Send + 'static,"], [163, "{"], [164, "    pub async fn claim_batch(&self, cfg: ClaimCfg) -> Result<Vec<ClaimedMessage>, E>;"], [165, "    pub async fn ack(&self, id: Uuid) -> Result<(), E>;"], [166, "    pub async fn nack(&self, id: Uuid, err: &str) -> Result<(), E>;"], [167, "}"], [168, "```"], [169, ""], [170, "## 2. Actor Flows (CDSL)"], [171, ""], [172, "### Operation Commit Enqueues Outbox Row"], [173, ""], [174, "- [ ] `p1` - **ID**: `cpt-cf-mini-chat-flow-usage-outbox-enqueue`"], [175, ""], [176, "**Actor**: `cpt-cf-mini-chat-actor-chat-user`"], [177, ""], [178, "**Success Scenarios**:"], [179, " - An operation commits, and exactly one logical outbox event is enqueued atomically (resulting in at most one `toolkit_outbox_events` row per `dedupe_key`)."], [180, ""], [181, "**Error Scenarios**:"], [182, "- The DB transaction fails: the described side effects and outbox insertion MUST both roll back."], [183, ""], [184, "**Behavior (normative)**:"], [185, "- The outbox row insertion is part of the operation's commit: it MUST be in the **same DB transaction** as the committed side effects."], [186, "- Within that transaction:"], [187, "  - The system MUST enqueue exactly one logical outbox event describing the committed side effects. If a `dedupe_key` conflict occurs, the event is considered already enqueued; no duplicate row is inserted."], [188, "- If an operation implementation uses a uniqueness guard for idempotent enqueue (e.g. a stable `dedupe_key` with a unique index):"], [189, "  - A conflict on insert MUST be treated as \"already enqueued\"."], [190, "- If the transaction fails/rolls back for any reason:"], [191, "  - No `toolkit_outbox_events` row is persisted."], [192, ""], [193, "**Payload requirements**:"], [194, "- The outbox payload MUST include sufficient identifiers for idempotent downstream processing."], [195, "- The outbox row SHOULD include a stable `dedupe_key` suitable for idempotency."], [196, ""], [197, "### Outbox Dispatcher Publishes Events"], [198, ""], [199, "- [ ] `p1` - **ID**: `cpt-cf-mini-chat-flow-usage-outbox-dispatch`"], [200, ""], [201, "**Actor**: `cpt-cf-mini-chat-actor-usage-outbox-dispatcher`"], [202, ""]], "section": {"id": "sec:gears/mini-chat/docs/features/outbox-pattern.md#13-actors", "title": "Actors", "line": 26}}], "gear": "mini-chat", "source": "deterministic", "suggestion": null, "title": "An id is used but never defined", "origin": "corpus", "docs": ["gears/mini-chat/docs/features/outbox-pattern.md"], "path": null, "hops": null, "section_linked": null}, {"fingerprint": "2641eceba6afd223", "rule": "reference.defined", "gate": "block", "subject": "gears/mini-chat/docs/features/outbox-pattern.md->cpt-cf-mini-chat-feature-usage-outbox", "message": "cpt-cf-mini-chat-feature-usage-outbox is not defined in mini-chat", "locations": [{"path": "gears/mini-chat/docs/features/outbox-pattern.md", const docs = new Map(DATA.docs.map((d) => [d.id, d]));
const short = (p) => (docs.get(p) || {}).label || p.split("/").pop();
const gearOf = (p) => (docs.get(p) || {}).gear || p.split("/docs/")[0].replace(/^gears\//, "");
const changed = new Set(DATA.changed);
const prFindings = DATA.findings.filter((f) => f.origin !== "corpus");
const mark = (g) => (g === "block" ? "■" : "◆");
const ghLine = (l) => DATA.meta.repo_url && DATA.meta.rev
  ? `${DATA.meta.repo_url}/blob/${DATA.meta.rev}/${l.path}#L${l.line_start}${l.line_end && l.line_end !== l.line_start ? "-L" + l.line_end : ""}` : null;

$("#title").textContent = DATA.meta.title || "Spec graph";
$("#rev").textContent = [DATA.meta.pr ? `PR #${DATA.meta.pr}` : "", DATA.meta.rev ? `@ ${DATA.meta.rev.slice(0, 10)}` : ""].filter(Boolean).join(" ");
const m = DATA.metric;
$("#metric").innerHTML = `<span><b>${DATA.docs.length}</b> documents</span><span><b>${DATA.links.length}</b> document links</span>` +
  `<span><b>${DATA.findings.length}</b> findings</span>` +
  (m.pairs ? `<span><b>${m.passages_not_linked} of ${m.pairs}</b> conflicting passage pairs: neither section links to the other side` +
    (m.cross_document ? ` (their documents are linked: ${m.docs_within_2_hops} of ${m.cross_document} within 2 hops; ${m.same_document} pairs sit in one document)` : "") + `</span>` : "");
if (!DATA.changed.length && !DATA.meta.pr) $("#nav-pr").hidden = true;

function style() {
  return [
    { selector: "node", style: { "font-family": "IBM Plex Sans, system-ui, sans-serif", "font-size": 12, color: css("--ink"),
      label: "data(label)", "text-wrap": "wrap", "text-max-width": 90 } },
    { selector: ":parent", style: { "background-color": css("--gear"), "border-width": 0, shape: "round-rectangle",
      "text-valign": "top", "text-halign": "center", "font-size": 12, "font-weight": 600, color: css("--gear-ink"), padding: 14 } },
    { selector: "node.doc", style: { shape: "round-rectangle", width: "label", height: 18, padding: 6, "background-color": css("--doc"),
      "border-width": 1, "border-color": css("--doc-line"), "text-valign": "center", "text-halign": "center" } },
    { selector: "node.doc.k-ADR", style: { shape: "rectangle" } },
    { selector: "node.doc.superseded", style: { color: css("--ink-3"), "border-style": "dotted" } },
    { selector: "node.has-advise", style: { "border-width": 3, "border-style": "dashed", "border-color": css("--advise") } },
    { selector: "node.has-block", style: { "border-width": 3, "border-style": "solid", "border-color": css("--block") } },
    { selector: "node.changed", style: { "background-color": css("--changed-soft"), "outline-width": 3, "outline-color": css("--changed"), "outline-offset": 2 } },
    { selector: "node.faded", style: { opacity: 0.25 } },
    { selector: "edge", style: { width: 1, "line-color": css("--edge"), "curve-style": "bezier", opacity: 0.8 } },
    { selector: "edge.cite", style: { "line-style": "dashed" } },
    { selector: "edge.f-advise", style: { width: 2.5, "line-color": css("--advise"), "line-style": "dashed", "curve-style": "unbundled-bezier", opacity: 1 } },
    { selector: "edge.f-block", style: { width: 2.5, "line-color": css("--block"), "curve-style": "unbundled-bezier", opacity: 1 } },
    { selector: "edge.faded", style: { opacity: 0.08 } },
    { selector: "node.passage", style: { shape: "round-rectangle", width: "label", height: "label", padding: 8, "background-color": css("--panel"),
      "border-width": 2, "font-family": "IBM Plex Mono, monospace", "font-size": 10, "text-max-width": 160, "text-valign": "center", "text-halign": "center" } },
    { selector: "node.passage.block", style: { "border-color": css("--block") } },
    { selector: "node.passage.advise", style: { "border-color": css("--advise"), "border-style": "dashed" } },
    { selector: "node.section", style: { shape: "round-rectangle", width: "label", height: 18, padding: 6, "background-color": css("--gear"),
      color: css("--ink-2"), "border-width": 0, "text-valign": "center", "text-halign": "center" } },
    { selector: "node.slot", style: { shape: "diamond", width: 22, height: 22, "background-color": css("--advise"), label: "data(label)",
      "text-valign": "bottom", "text-margin-y": 4, "font-size": 10, color: css("--ink-2") } },
    { selector: "node.slot.block", style: { "background-color": css("--block"), shape: "rectangle" } },
    { selector: "edge.path", style: { width: 2, "line-color": css("--ink-3"), label: "data(label)", "font-size": 9, color: css("--ink-3"),
      "text-background-color": css("--panel"), "text-background-opacity": 1 } },
    { selector: "edge.nopath", style: { width: 1.5, "line-color": css("--ink-3"), "line-style": "dotted", label: "data(label)", "font-size": 10,
      color: css("--ink-2"), "text-background-color": css("--panel"), "text-background-opacity": 1, "text-wrap": "wrap" } },
  ];
}

let cy = null;
function draw(elements, layout) {
  if (cy) cy.destroy();
  cy = cytoscape({ container: $("#cy"), elements, style: style(), wheelSensitivity: 0.3, minZoom: 0.2, maxZoom: 3 });
  cy.layout(layout).run();
  cy.fit(undefined, 24);
  if (cy.zoom() > 1.1) { cy.zoom(1.1); cy.center(); }   // a small graph is not blown up
  return cy;
}
const fcose = { name: "fcose", animate: false, quality: "proof", nodeRepulsion: 6000, idealEdgeLength: 45, nestingFactor: 0.5,
  gravityCompound: 1.2, packComponents: true, nodeDimensionsIncludeLabels: true, randomize: true };

function mapElements(onlyPr) {
  const pool = onlyPr ? prFindings : DATA.findings;
  const gears = onlyPr ? new Set([...changed].map(gearOf).concat(pool.flatMap((f) => f.docs.map(gearOf)))) : null;
  const byDoc = new Map();
  pool.forEach((f) => f.docs.forEach((d) => { const s = byDoc.get(d) || { block: 0, advise: 0 }; s[f.gate]++; byDoc.set(d, s); }));
  const el = [];
  const keep = DATA.docs.filter((d) => !gears || gears.has(d.gear));
  new Set(keep.map((d) => d.gear)).forEach((g) => el.push({ data: { id: "g:" + g, label: g } }));
  const ids = new Set(keep.map((d) => d.id));
  keep.forEach((d) => {
    const s = byDoc.get(d.id); const cls = ["doc", "k-" + d.kind];
    if (d.status === "superseded") cls.push("superseded");
    if (s && s.advise) cls.push("has-advise"); if (s && s.block) cls.push("has-block");
    if (changed.has(d.id)) cls.push("changed");
    const marks = (s && s.block ? ` ■${s.block}` : "") + (s && s.advise ? ` ◆${s.advise}` : "") + (changed.has(d.id) ? " ✎" : "");
    el.push({ data: { id: d.id, parent: "g:" + d.gear, label: d.label + marks }, classes: cls.join(" ") });
  });
  DATA.links.forEach((l, i) => { if (ids.has(l.src) && ids.has(l.dst))
    el.push({ data: { id: "l" + i, source: l.src, target: l.dst }, classes: l.link ? "link" : "cite" }); });
  pool.forEach((f, i) => { if (f.docs.length >= 2 && ids.has(f.docs[0]) && ids.has(f.docs[1]))
    el.push({ data: { id: "f" + i, source: f.docs[0], target: f.docs[1], fp: f.fingerprint }, classes: "f-" + f.gate }); });
  return el;
}

function itemHtml(f) {
  const l = f.locations.find((x) => x.line_start) || f.locations[0] || {};
  return `<button class="item ${f.gate}" data-fp="${f.fingerprint}"><span class="mk" aria-label="${f.gate}">${mark(f.gate)}</span>` +
    `<span class="t">${esc(f.title)}</span><span class="w">${esc(short(l.path || ""))}${l.line_start ? ":" + l.line_start : ""}` +
    `${f.docs.length > 1 ? " ↔ " + esc(f.docs.slice(1).map(short).join(", ")) : ""}</span></button>`;
}
function listPanel(pool, heading, note) {
  const sorted = [...pool].sort((a, b) => (a.gate === b.gate ? 0 : a.gate === "block" ? -1 : 1));
  $("#panel").innerHTML = `<p class="sub">${esc(heading)}</p>${note ? `<p class="msg">${note}</p>` : ""}` +
    (sorted.length ? `<div class="list">${sorted.map(itemHtml).join("")}</div>` : `<p class="empty">No findings.</p>`);
  $("#panel").querySelectorAll(".item").forEach((b) => b.addEventListener("click", () => { location.hash = "f-" + b.dataset.fp; }));
}

function showMap(onlyPr) {
  const els = mapElements(onlyPr);
  const n = els.filter((e) => !e.data.source).length;
  // fewer documents: more room per node (one gear's 30 documents overlapped with the six-gear setting)
  draw(els, { ...fcose, nodeRepulsion: n < 50 ? 45000 : 6000, idealEdgeLength: n < 50 ? 110 : 45, nodeSeparation: 90 });
  $("#hint").textContent = "Click a document to list its findings, a coloured edge to open a finding.";
  const pool = onlyPr ? prFindings : DATA.findings;
  listPanel(pool, onlyPr ? "Findings this PR brings" : "All findings",
    onlyPr ? `${changed.size} document(s) changed: ${[...changed].map((p) => `<code>${esc(short(p))}</code>`).join(", ") || "none"}.` : "");
  cy.on("tap", "node.doc", (e) => {
    const id = e.target.id(); const mine = pool.filter((f) => f.docs.includes(id));
    cy.elements().addClass("faded"); e.target.closedNeighborhood().removeClass("faded"); e.target.ancestors().removeClass("faded");
    listPanel(mine, short(id), esc(docs.get(id)?.title || id));
  });
  cy.on("tap", (e) => { if (e.target === cy) { cy.elements().removeClass("faded"); listPanel(pool, onlyPr ? "Findings this PR brings" : "All findings"); } });
  cy.on("tap", "edge[fp]", (e) => { location.hash = "f-" + e.target.data("fp"); });
}

function showFinding(fp) {
  const f = DATA.findings.find((x) => x.fingerprint === fp);
  if (!f) { showMap(false); return; }
  const el = []; const gate = f.gate;
  const slot = f.rule.startsWith("contradiction.") && f.subject.includes(":") ? f.subject.split(":")[0] : null;
  if (slot) el.push({ data: { id: "slot", label: slot }, classes: "slot " + gate });
  f.locations.forEach((l, i) => {
    const pid = "p" + i;
    el.push({ data: { id: pid, label: `${short(l.path)}:${l.line_start ?? ""}\n${(l.quote || "").slice(0, 70)}` }, classes: "passage " + gate });
    const sid = l.section ? "s:" + l.section.id : null;
    if (sid && !el.some((x) => x.data.id === sid)) el.push({ data: { id: sid, label: "§ " + l.section.title }, classes: "section" });
    if (!el.some((x) => x.data.id === l.path)) el.push({ data: { id: l.path, label: short(l.path) }, classes: "doc k-" + (docs.get(l.path)?.kind || "") });
    if (sid) { el.push({ data: { id: pid + "-s", source: pid, target: sid } }); el.push({ data: { id: pid + "-d", source: sid, target: l.path } }); }
    else el.push({ data: { id: pid + "-d", source: pid, target: l.path } });
    if (slot) el.push({ data: { id: pid + "-slot", source: "slot", target: pid }, classes: "f-" + gate });
  });
  if (f.docs.length >= 2) {
    if (f.path && f.path.length > 1) {
      f.path.forEach((d, i) => {
        if (!el.some((x) => x.data.id === d)) el.push({ data: { id: d, label: short(d) }, classes: "doc k-" + (docs.get(d)?.kind || "") });
        if (i) el.push({ data: { id: "h" + i, source: f.path[i - 1], target: d, label: "link" }, classes: "path" });
      });
    } else if (!f.path) {
      el.push({ data: { id: "nopath", source: f.docs[0], target: f.docs[1], label: "no link path\nwithin 4 hops" }, classes: "nopath" });
    }
  }
  draw(el, { name: "fcose", animate: false, quality: "proof", nodeRepulsion: 12000, idealEdgeLength: 90, nodeDimensionsIncludeLabels: true, randomize: true });
  $("#hint").textContent = "Passages → their sections → their documents, and the link path between the documents.";
  const hopsPill = f.docs.length < 2 ? "" : f.hops == null ? `<span class="pill hops">no link path within 4 hops</span>`
    : `<span class="pill hops">documents ${f.hops} link hop${f.hops === 1 ? "" : "s"} apart</span>`;
  const secPill = f.section_linked === false ? `<span class="pill hops">the two sections do not link to each other</span>` : "";
  const quotes = f.locations.map((l) => {
    const url = ghLine(l);
    const lines = (l.text || []).map(([n, t]) => `<span class="ln${n >= l.line_start && n <= (l.line_end || l.line_start) ? " on" : ""}"><span class="n">${n}</span>${esc(t)}</span>`).join("");
    return `<div class="quote"><header><span>${esc(l.path.replace(/^gears\//, ""))}${l.line_start ? ":" + l.line_start : ""}</span>` +
      `${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">open</a>` : ""}</header>` +
      `${l.section ? `<div class="meta" style="padding:4px 10px 0">§ ${esc(l.section.title)}</div>` : ""}<pre>${lines || esc(l.quote || "")}</pre></div>`;
  }).join("");
  const sugg = f.suggestion ? `<p class="sub">Suggested replacement for ${esc(short(f.suggestion.path))}:${f.suggestion.line_start}</p><pre class="sugg">${esc(f.suggestion.text)}</pre>` : "";
  $("#panel").innerHTML = `<button class="back" id="back">← back</button>` +
    `<div style="display:flex;flex-wrap:wrap;gap:6px"><span class="pill ${gate}">${mark(gate)} ${gate === "block" ? "blocking" : "advisory"}</span>${hopsPill}${secPill}</div>` +
    `<h2>${esc(f.title)}</h2><p class="meta">${esc(f.rule)} · ${esc(f.source)} · ${esc(f.fingerprint)}</p>` +
    `<p class="msg">${esc(f.message)}</p><div class="quotes">${quotes}</div>${sugg}`;
  $("#back").addEventListener("click", () => { history.length > 1 ? history.back() : (location.hash = "map"); });
}

function route() {
  const h = location.hash.slice(1);
  $("#nav-map").removeAttribute("aria-current"); $("#nav-pr").removeAttribute("aria-current");
  if (h.startsWith("f-")) return showFinding(h.slice(2));
  const pr = h === "pr" || (!h && (DATA.meta.pr || DATA.changed.length));
  $(pr ? "#nav-pr" : "#nav-map").setAttribute("aria-current", "page");
  showMap(pr);
}
window.addEventListener("hashchange", route);
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => cy && cy.style(style()));
route();
</script>

</body></html>

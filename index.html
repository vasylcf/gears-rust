<style>
/* Layout: a working tool. Header with the revision and the metric; the graph fills the left, the
   reading panel the right (stacked on phones). Findings keep two cues besides colour:
   blocking = magenta, solid ring, ■ ; advisory = blue, dashed ring, ◆ ; changed by the PR = amber, ✎. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --ink-2: #4a5160; --ink-3: #7b8292; --rule: #dde1e8;
  --gear: #eceff4; --gear-ink: #5d6575; --doc: #ffffff; --doc-line: #9aa3b2; --edge: #b8bfcc;
  --block: #b4246f; --block-soft: #f7e3ee; --advise: #2463c9; --advise-soft: #e3ecfa;
  --changed: #c78f00; --changed-soft: #fbf1d6; --hl: #fff4c2;
  --f-display: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121419; --panel: #1a1d24; --ink: #e9ecf2; --ink-2: #b3bac8; --ink-3: #868ea0; --rule: #2c313b;
  --gear: #1f232b; --gear-ink: #9aa2b3; --doc: #262a33; --doc-line: #5c6475; --edge: #4a5161;
  --block: #ec6aa9; --block-soft: #3a1d2c; --advise: #6ea2f2; --advise-soft: #1b2a44;
  --changed: #e6b437; --changed-soft: #3a3016; --hl: #3b3517; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121419; --panel: #1a1d24; --ink: #e9ecf2; --ink-2: #b3bac8; --ink-3: #868ea0; --rule: #2c313b;
  --gear: #1f232b; --gear-ink: #9aa2b3; --doc: #262a33; --doc-line: #5c6475; --edge: #4a5161;
  --block: #ec6aa9; --block-soft: #3a1d2c; --advise: #6ea2f2; --advise-soft: #1b2a44;
  --changed: #e6b437; --changed-soft: #3a3016; --hl: #3b3517; color-scheme: dark }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); }
.app { display: flex; flex-direction: column; height: 100%; padding-block: 12px;

header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px }

.meta { color: var(--ink-3); font: 12px var(--f-mono) }
nav { display: flex; gap: 4px; margin-left: auto }
nav a { color: var(--ink-2); text-decoration: none; padding: 4px 10px; border-radius: 6px; font-weight: 500 }
nav a[aria-current="page"] { background: var(--ink); color: var(--bg) }
nav a:focus-visible, button:focus-visible, .item:focus-visible { outline: 2px solid var(--advise); outline-offset: 2px }
.metric { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--ink-2); font-size: 13px }
.metric b { font: 600 15px var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2) }
.legend span::before { margin-right: 4px }
.lg-block::before { content: "■"; color: var(--block) } .lg-advise::before { content: "◆"; color: var(--advise) }
.lg-changed::before { content: "✎"; color: var(--changed) } .lg-link::before { content: "—"; color: var(--ink-3) }
.lg-cite::before { content: "┄"; color: var(--ink-3) }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); gap: 12px }
.canvas { position: relative; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; min-height: 380px; overflow: hidden }
#cy { position: absolute; inset: 0 }
.hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--ink-3); pointer-events: none }
aside { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: auto; min-width: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px }
aside h2 { font: 600 15px/1.3 var(--f-display); margin: 0; text-wrap: balance }
.sub { color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 0 }
.list { display: flex; flex-direction: column; gap: 6px }
.item { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 8px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--rule); cursor: pointer; text-align: left; background: none; color: inherit; font: inherit }
.item:hover { background: var(--bg) }
.item .mk { font-size: 13px; line-height: 1.5 } .item.block .mk { color: var(--block) } .item.advise .mk { color: var(--advise) }
.item .t { font-weight: 500 } .item .w { grid-column: 2; color: var(--ink-3); font: 12px var(--f-mono); overflow-wrap: anywhere }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px }
.pill.block { background: var(--block-soft); color: var(--block) } .pill.advise { background: var(--advise-soft); color: var(--advise) }
.pill.hops { background: var(--bg); color: var(--ink-2); border: 1px solid var(--rule) }
.msg { color: var(--ink-2); margin: 0; max-width: 65ch }
.quotes { display: grid; grid-template-columns: 1fr; gap: 10px }
.quote { border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; min-width: 0 }
.quote header { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; background: var(--bg); font: 12px var(--f-mono); color: var(--ink-2) }
.quote header a { color: var(--advise) }
.quote pre { margin: 0; padding: 6px 0; overflow-x: auto; font: 12px/1.55 var(--f-mono) }
.quote .ln { display: block; padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere }
.quote .ln.on { background: var(--hl) }
.quote .n { display: inline-block; width: 3.2em; color: var(--ink-3); user-select: none; font-variant-numeric: tabular-nums }
.sugg { font: 12px/1.5 var(--f-mono); background: var(--bg); border: 1px dashed var(--rule); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 }
.empty { color: var(--ink-3) }
button.back { align-self: flex-start; background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 3px 10px; color: var(--ink-2); cursor: pointer; font: inherit }
@media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 55vh auto } html, body { height: auto } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

    <aside id="panel" aria-live="polite"></aside>

</div>

-derive; IP-based endpoints require explicit alias."], [313, ""]], "section": {"id": "sec:gears/system/oagw/docs/features/0002-cpt-cf-oagw-feature-management-api.md#alias-enforcement-algorithm", "title": "Alias Enforcement Algorithm", "line": 304}}, {"path": "gears/system/oagw/docs/features/0002-cpt-cf-oagw-feature-management-api.md", "line_start": 446, "line_end": 446, "quote": null, "text": [[445, ""], [446, "The system **MUST** enforce alias rules based on endpoint type following `cpt-cf-oagw-algo-mgmt-enforce-alias`. Hostname-based endpoints auto-derive alias (user-provided alias is rejected). IP-based or non-derivable endpoints require explicit alias. Aliases **MUST** be normalized (ASCII lowercase, trailing dot stripped) and unique per `(tenant_id, alias)` with a database uniqueness constraint. On update, alias is re-enforced when endpoints change per the transition rules (hostname→hostname recomputes, hostname→IP requires explicit, IP→IP retains, IP→hostname recomputes). Alias-only updates (no endpoint change) **MUST** follow the same hostname/IP branching: hostname-based endpoints reject user-provided alias (unless it exactly matches the derived value); IP-based or non-derivable endpoints accept and normalize the new alias. Alias normalization and the `(tenant_id, alias)` uniqueness constraint apply to alias-only updates. Tests **MUST** cover the alias-only branches for both hostname-based (rejection) and IP-based (acceptance) endpoints. Endpoint hostnames **MUST** be validated per RFC 1123."], [447, ""]], "section": {"id": "sec:gears/system/oagw/docs/features/0002-cpt-cf-oagw-feature-management-api.md#implement-alias-enforcement-and-uniqueness", "title": "Implement Alias Enforcement and Uniqueness", "line": 442}}], "gear": null, "source": "llm:judge + manual check", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/system/oagw/docs/features/0002-cpt-cf-oagw-feature-management-api.md"], "path origin": "corpus", "docs": ["gears/mini-chat/docs/features/outbox-pattern.md"], "path": null, "hops": null, "section_linked": null}, {"fingerprint": "da6cd7fc9da5ade0", "rule": "reference.defined", "gate": "block", "subject": "gears/mini-chat/docs/features/outbox-pattern.md->cpt-cf-mini-chat-actor-usage-outbox-dispatcher", "message": "cpt-cf-mini-chat-actor-usage-outbox-dispatcher is not defined in mini-chat", "locations": [{"path": "gears/mini-chat/docs/features/outbox-pattern.md", "line_start": 31, "line_end": 201, "quote": null, "text": [[30, "| `cpt-cf-mini-chat-actor-chat-user` | Initiates an operation whose commit MUST enqueue an outbox event (when side effects are applied). |"], [31, "| `cpt-cf-mini-chat-actor-usage-outbox-dispatcher` | Background worker that claims pending outbox rows and publishes events to a downstream consumer with retries. |"], [32, "| `cpt-cf-mini-chat-actor-outbox-consumer` | Downstream event consumer that processes deliveries idempotently. |"], [33, ""], [34, "### 1.4 References"], [35, ""], [36, "- ToolKit lifecycle/stateful tasks documentation (stateful worker)"], [37, ""], [38, "### 1.5 Implementation Shape (normative)"], [39, ""], [40, "- Outbox events are enqueued through `toolkit_db::outbox::enqueue(runner, msg)` where `runner: &impl DBRunner`."], [41, "- The enqueue call MUST run inside the same DB transaction as the side effects the event describes."], [42, "- A background dispatcher (ToolKit `stateful` lifecycle task) claims events from `toolkit_outbox_events` using a lease (`locked_by`, `locked_until`) and delivers them with retries."], [43, "- Producers SHOULD provide a stable `dedupe_key` to support idempotent enqueue and idempotent downstream processing."], [44, ""], [45, "### 1.6 Outbox Storage (normative)"], [46, ""], [47, "Outbox events are stored in a shared infrastructure table owned by `toolkit-db`:"], [48, ""], [49, "`toolkit_outbox_events`"], [50, ""], [51, "**Columns (minimum)**:"], [52, ""], [53, "- `id uuid pk`"], [54, "- `namespace text not null`"], [55, "- `topic text not null`"], [56, "- `tenant_id uuid null`"], [57, "- `dedupe_key text null`"], [58, "- `payload jsonb not null`"], [59, "- `status text not null` (`pending|processing|delivered|dead`)"], [60, "- `attempts int not null default 0`"], [61, "- `next_attempt_at timestamptz not null default now()`"], [62, "- `locked_by uuid null`"], [63, "- `locked_until timestamptz null`"], [64, "- `last_error text null`"], [65, "- `created_at timestamptz not null default now()`"], [66, "- `updated_at timestamptz not null default now()` — MUST be set to `now()` by application code on every state transition (`claim`, `ack`, `nack`). Not managed by a DB trigger."], [67, ""], [68, "**Indexes (minimum)**:"], [69, ""], [70, "- `index(status, next_attempt_at)`"], [71, "- `index(locked_until)`"], [72, ""], [73, "**Dedupe / idempotency (Postgres)**:"], [74, ""], [75, "- Partial unique index on `(namespace, topic, dedupe_key)` where `dedupe_key IS NOT NULL`."], [76, ""], [77, "**`tenant_id` column vs `dedupe_key` — distinct purposes (normative)**:"], [78, ""], [79, "The `tenant_id` column and the `dedupe_key` field serve different roles and MUST NOT be conflated:"], [80, ""], [81, "- **`tenant_id` column** — used for routing, filtering, and downstream partitioning. The dispatcher MAY use it to scope claim queries to a specific tenant. Downstream consumers MAY use it for partition-aware processing. It is nullable to accommodate system-level events that are not tenant-scoped."], [82, "- **`dedupe_key`** — a producer-defined idempotency key whose structure is domain-specific. The partial unique index on `(namespace, topic, dedupe_key)` enforces at-most-once enqueue at the database level. The generic outbox library treats `dedupe_key` as an opaque string and performs NO validation on its structure."], [83, ""], [84, "**Dedupe key requiredness by event type (normative):**"], [85, ""], [86, "The generic outbox library allows `dedupe_key` to be NULL (the partial unique index only applies when `dedupe_key IS NOT NULL`). However, gears MUST follow these rules when enqueuing events:"], [87, ""], [88, "1. **Quota-bearing / billing events** — MUST have non-null `dedupe_key`"], [89, "   - Events that result in quota debit, credit, or billing charges"], [90, "   - Events that participate in financial reconciliation"], [91, "   - Examples: Mini-Chat usage snapshots, subscription charges, refunds"], [92, "   - Rationale: At-least-once delivery semantics require idempotent deduplication to prevent double-charging"], [93, ""], [94, "2. **Critical state transitions** — SHOULD have non-null `dedupe_key`"], [95, "   - Events that trigger irreversible downstream actions"], [96, "   - Events used for audit trails or compliance logging"], [97, "   - Examples: user deletion notifications, access revocations"], [98, "   - Rationale: Prevents duplicate side effects in distributed systems"], [99, ""], [100, "3. **Informational telemetry** — MAY have NULL `dedupe_key`"], [101, "   - Non-critical metrics, analytics, or monitoring events"], [102, "   - Events where duplicate delivery is acceptable"], [103, "   - Examples: page view counters, system health heartbeats"], [104, "   - Rationale: Reduces storage overhead when idempotency is not required"], [105, ""], [106, "**Mini-Chat-specific convention (not enforced by generic library):** In the Mini Chat domain, the canonical format is `\"{tenant_id}/{turn_id}/{request_id}\"` (see DESIGN.md section 5.6). Mini Chat domain code MUST validate this format and enforce non-null `dedupe_key` for all quota-bearing events before calling `enqueue`. The validation is the caller's responsibility, not the outbox library's. Mini Chat downstream consumers MUST use the same canonical tuple `(tenant_id, turn_id, request_id)` — extracted from the `dedupe_key` or from the payload — for idempotent processing. Other gears define their own `dedupe_key` format and idempotency extraction rules in their respective feature specs."], [107, ""], [108, "The presence of `tenant_id` as a table column does not replace domain-level idempotency semantics embedded in `dedupe_key`. The two serve different purposes. When both are populated, gears SHOULD ensure consistency (tenant_id column matches the tenant component of dedupe_key), but this is a gear-level convention, not a database constraint."], [109, ""], [110, "### 1.7 Proposed `toolkit_db::outbox` v1 API (sketch)"], [111, ""], [112, "This is the intended interface shape for the generalized outbox mechanism in `toolkit-db`."], [113, "Gears consume this API with their own `namespace/topic`."], [114, ""], [115, "```rust"], [116, "use toolkit_db::secure::DBRunner;"], [117, "use toolkit_db::DBProvider;"], [118, "use serde_json::Value;"], [119, "use std::time::Duration;"], [120, "use uuid::Uuid;"], [121, ""], [122, "pub struct OutboxMessage {"], [123, "    pub namespace: &'static str,"], [124, "    pub topic: &'static str,"], [125, "    pub tenant_id: Option<Uuid>,"], [126, "    pub dedupe_key: Option<String>,"], [127, "    pub payload: Value,"], [128, "}"], [129, ""], [130, "pub async fn enqueue("], [131, "    runner: &impl DBRunner,"], [132, "    msg: OutboxMessage,"], [133, ") -> Result<Uuid, toolkit_db::DbError>;"], [134, ""], [135, "pub struct ClaimCfg {"], [136, "    pub batch_size: u32,"], [137, "    pub lease_duration: Duration,"], [138, "    /// Maximum total delivery attempts (including the first)."], [139, "    /// Claim query excludes rows where `attempts >= max_attempts`."], [140, "    /// Same value used by retry logic (section 3) for dead-lettering."], [141, "    pub max_attempts: u32,"], [142, "}"], [143, ""], [144, "pub struct ClaimedMessage {"], [145, "    pub id: Uuid,"], [146, "    pub namespace: String,"], [147, "    pub topic: String,"], [148, "    pub tenant_id: Option<Uuid>,"], [149, "    pub dedupe_key: Option<String>,"], [150, "    pub payload: Value,"], [151, "    pub attempts: i32,"], [152, "}"], [153, ""], [154, "pub struct OutboxStore<E> {"], [155, "    pub db: DBProvider<E>,"], [156, "    pub worker_id: Uuid,"], [157, "    pub namespace: String,"], [158, "}"], [159, ""], [160, "impl<E> OutboxStore<E>"], [161, "where"], [162, "    E: From<toolkit_db::DbError> + Send + 'static,"], [163, "{"], [164, "    pub async fn claim_batch(&self, cfg: ClaimCfg) -> Result<Vec<ClaimedMessage>, E>;"], [165, "    pub async fn ack(&self, id: Uuid) -> Result<(), E>;"], [166, "    pub async fn nack(&self, id: Uuid, err: &str) -> Result<(), E>;"], [167, "}"], [168, "```"], [169, ""], [170, "## 2. Actor Flows (CDSL)"], [171, ""], [172, "### Operation Commit Enqueues Outbox Row"], [173, ""], [174, "- [ ] `p1` - **ID**: `cpt-cf-mini-chat-flow-usage-outbox-enqueue`"], [175, ""], [176, "**Actor**: `cpt-cf-mini-chat-actor-chat-user`"], [177, ""], [178, "**Success Scenarios**:"], [179, " - An operation commits, and exactly one logical outbox event is enqueued atomically (resulting in at most one `toolkit_outbox_events` row per `dedupe_key`)."], [180, ""], [181, "**Error Scenarios**:"], [182, "- The DB transaction fails: the described side effects and outbox insertion MUST both roll back."], [183, ""], [184, "**Behavior (normative)**:"], [185, "- The outbox row insertion is part of the operation's commit: it MUST be in the **same DB transaction** as the committed side effects."], [186, "- Within that transaction:"], [187, "  - The system MUST enqueue exactly one logical outbox event describing the committed side effects. If a `dedupe_key` conflict occurs, the event is considered already enqueued; no duplicate row is inserted."], [188, "- If an operation implementation uses a uniqueness guard for idempotent enqueue (e.g. a stable `dedupe_key` with a unique index):"], [189, "  - A conflict on insert MUST be treated as \"already enqueued\"."], [190, "- If the transaction fails/rolls back for any reason:"], [191, "  - No `toolkit_outbox_events` row is persisted."], [192, ""], [193, "**Payload requirements**:"], [194, "- The outbox payload MUST include sufficient identifiers for idempotent downstream processing."], [195, "- The outbox row SHOULD include a stable `dedupe_key` suitable for idempotency."], [196, ""], [197, "### Outbox Dispatcher Publishes Events"], [198, ""], [199, "- [ ] `p1` - **ID**: `cpt-cf-mini-chat-flow-usage-outbox-dispatch`"], [200, ""], [201, "**Actor**: `cpt-cf-mini-chat-actor-usage-outbox-dispatcher`"], [202, ""]], "section": {"id": "sec:gears/mini-chat/docs/features/outbox-pattern.md#13-actors", "title": "Actors", "line": 26}}], "gear": "mini-chat", "source": "deterministic", "suggestion": null, "title": "An id is used but never defined", "origin": "corpus", "docs": ["gears/mini-chat/docs/features/outbox-pattern.md"], "path": null, "hops": null, "section_linked": null}, {"fingerprint": "2641eceba6afd223", "rule": "reference.defined", "gate": "block", "subject": "gears/mini-chat/docs/features/outbox-pattern.md->cpt-cf-mini-chat-feature-usage-outbox", "message": "cpt-cf-mini-chat-feature-usage-outbox is not defined in mini-chat", "locations": [{"path": "gears/mini-chat/docs/features/outbox-pattern.md", "line_start": 5, "line_end": 5, "quote": null, "text": [[4, "<!-- reference to DECOMPOSITION entry -->"], [5, "- [ ] `p1` - `cpt-cf-mini-chat-feature-usage-outbox`"], [6, ""]], "section": null}], "gear": "mini-chat", "source": "deterministic", "suggestion": null, "title": "An id is used but never defined", "origin": "corpus", "docs": ["gears/mini-chat/docs/features/outbox-pattern.md"], "path": null, "hops": null, "section_linked": null}, {"fingerprint": "5f6755ae544c874f", "rule": "stale.superseded-link", "gate": "block", "subject": "gears/system/oagw/docs/ADR/0002-request-routing.md:244 -> ./0001-component-architecture.md", "message": "links to gears/system/oagw/docs/ADR/0001-component-architecture.md, which is superseded", "locations": [{"path": "gears/system/oagw/docs/ADR/0002-request-routing.md", "line_start": 244, "line_en ": {"id": "sec:gears/file-storage/docs/features/multipart-coordinator.md#6-acceptance-criteria", "title": "Acceptance Criteria", "line": 444}}], "gear": "gears/file-storage", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/file-storage/docs/features/multipart-coordinator.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "fafd3f22040b8006", "rule": "contradiction.value", "gate": "advise", "subject": "multipart complete / if match support: DECOMPOSITION.md:83 vs multipart-coordinator.md:188", "message": "Both describe the same multipart complete endpoint. A explicitly says it does not accept If-Match, while B explicitly labels its steps as current, shipped behavior and specifies accepting and checking that header. A's reference to an originally specified richer contract does not reconcile B's explicit current-status claim.", "locations": [{"path": "gears/file-storage/docs/DECOMPOSITION.md", "line_start": 83, "line_end": 83, "quote": "does **not** accept `If-Match`", "text": [[82, "  - Sidecar part-upload handler: verify the signed token, enforce per-part size claim (HTTP 413), write part bytes, compute the per-part hash, and report it to the control plane over a token-authenticated callback (the sidecar has no DB connection of its own)"], [83, "  - `POST .../multipart/{upload_id}/complete` -- verify assembled size against declared_size, assemble + hash the parts, **finalize** the version (`pending -> available`); does **not** bind (`content_id` untouched) and does **not** accept `If-Match` -- see [features/multipart-coordinator.md](features/multipart-coordinator.md) for the tracked gap between this and the richer `If-Match`/`200`-body/missing-parts contract originally specified"], [84, "  - `DELETE .../multipart/{upload_id}` -- abort: mark session aborted, delete part rows and pending version, abort backend handle for multi ons": [{"path": "gears/file-storage/docs/features/retention-cleanup.md", "line_start": 406, "line_end": 407, "quote": "Once that same session's `expires_at` has also passed, the session is aborted by the sweep's own step 2 and\nits previously-protected version becomes reclaimable by step 1 on a subsequent cycle", "text": [[405, "  the zero-version-orphan-file check (`has_blocking_multipart_session`)"], [406, "- [x] Once that same session's `expires_at` has also passed, the session is aborted by the sweep's own step 2 and"], [407, "  its previously-protected version becomes reclaimable by step 1 on a subsequent cycle"], [408, "- [x] An expired multipart session is aborted via a CAS (`in_progress -> aborted`) that a concurrent"]], "section": {"id": "sec:gears/file-storage/docs/features/retention-cleanup.md#6-acceptance-criteria", "title": "Acceptance Criteria", "line": 385}}, {"path": "gears/file-storage/docs/operations.md", "line_start": 191, "line_end": 193, "quote": "wins the session's own `in_progress → aborted` CAS first (racing a concurrent `complete`/user-`abort`), and only on winning that race does it tell the backend to discard the in-progress upload and delete the associated pending version row.", "text": [[190, "2. **Expired-multipart sweep** — aborts `multipart_uploads` sessions still `in_progress` whose `expires_at` has"], [191, "   passed: wins the session's own `in_progress → aborted` CAS first (racing a concurrent `complete`/user-`abort`),"], [192, "   and only on winning that race does it tell the backend to discard the in-progress upload and delete the"], [193, "   associated pending version row."], [194, "3. **Retention-expiry sweep** (`cpt-cf-file-storage-fr-retention-policies`) — keyset-paginated (500 files per page,"]], "section": {"id": "sec:gears/file-storage/docs/operations.md#the-background-cleanup-sweep", "title": "The background cleanup sweep", "line": 174}}], "gear": "gears/file-storage", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give a different lifecycle or timing for one thing", "origin": "corpus", "docs": ["gears/file-storage/docs/features/retention-cleanup.md", "gears/file-storage/docs/operations.md"], "path": ["gears/file-storage/docs/features/retention-cleanup.md", "gears/file-storage/docs/DESIGN.md", "gears/file-storage/docs/operations.md"], "hops": 2, "section_linked": false}, {"fingerprint": "82491bfb07bb37b1", "rule": "contradiction.value", "gate": "advise", "subject": "signed url credential / expected upload hash: DESIGN.md:1529 vs api.md:429", "message": "Both specify the response for violating the same P1 upload expected_hash constraint, but A requires 422 and B requires 400. B's footnote explicitly confirms 400 and calls 422 previously documented; A nevertheless presents 422 as an active requirement, not historical context.", "locations": [{"path": "gears/file-storage/docs/DESIGN.md", "line_start": 1529, "line_end": 1529, "quote": "| Expected hash | `expected_hash` (`<alg>:<hex>`) | no | P1 | upload | `422` |", "text": [[1528, "| Exact size | `exact_size` | no | P1 | upload | `413` over / `400` under |"], [1529, "| Expected hash | `expected_hash` (`<alg>:<hex>`) | no | P1 | upload | `422` |"], [1530, "| Max rate | `max_rate` (bytes/s) | no | **P2** | up/down | throttled to ≤ rate |"]], "section": {"id": "sec:gears/file-storage/docs/DESIGN.md#45-signed-url-signature", "title": "Signed-URL signature", "line": 1484}}, {"path": "gears/file-storage/docs/api.md", "line_start": 429, "line_end": 429, "quote": "| `expected_hash` = `<alg>:<hex>` | no | P1 | upload | `400`² |", "text": [[428, "  | `exact_size` | no | P1 | upload | `400`¹ |"], [429, "  | `expected_hash` = `<alg>:<hex>` | no | P1 | upload | `400`² |"], [430, "  | `max_rate` | no | P2 | up/down | throttle |"]], "section": {"id": "sec:gears/file-storage/docs/api.md#signed-urls", "title": "Signed URLs", "line": 396}}], "gear": "gears/file-storage", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/file-storage/docs/DESIGN.md", "gears/file-storage/docs/api.md"], "path": ["gears/file-storage/docs/DESIGN.md", "gears/file-storage/docs/api.md"], "hops": 1, "section_linked": false}, {"fingerprint": "bf1ea1eac3703f84", "rule": "contradiction.value", "gate": "advise", "subject": "storagebackend / type and location: DESIGN.md:120 vs DESIGN.md:1934", "message": "The conflict concerns P1 backend support, not the trait's type or location. A explicitly includes an S3-compatible driver in P1, while B says P1 ships local-filesystem and in-memory backends and explicitly defers S3. These give incompatible P1 implementation requirements; neither statement is marked as superseded.", "locations": [{"path": "gears/file-storage/docs/DESIGN.md", "line_start": 120, "line_end": 120, "quote": "`StorageBackend` async trait (in the **sidecar**) with capability sub-traits", "text": [[119, "| `cpt-cf-file-storage-fr-retention-indefinite`          | No background purge in P1; files live until owner deletes                                                                                                                |"], [120, "| `cpt-cf-file-storage-fr-backend-abstraction`           | `StorageBackend` async trait (in the **sidecar**) with capability sub-traits; P1 drivers: `local-filesystem`, `s3-compatible`                                                                 |"], [121, "| `cpt-cf-file-storage-fr-backend-capabilities`          | `BackendCapabilities` struct per driver, exposed via `GET /storages`; **no `versioning_native`** (versioning is FileStorage-level); P1 optional capabilities inactive                     |"]], "section": {"id": "sec:gears/file-storage/docs/DESIGN.md#functional-drivers-p1", "title": "Functional Drivers (P1)", "line": 102}}, {"path": "gears/file-storage/docs/DESIGN.md", "line_start": 1934, "line_end": 1935, "quote": "P1 ships a `StorageBackend` trait with two\n  backend *types* — a local-filesystem backend (default) and an in-memory backend", "text": [[1933, "  bind transaction (single transaction: CAS `content_id`, clear old `is_current`, set new), preventing split-brain."], [1934, "- **Backends (§3.2, `cpt-cf-file-storage-fr-backend-capabilities`).** P1 ships a `StorageBackend` trait with two"], [1935, "  backend *types* — a local-filesystem backend (default) and an in-memory backend — plus a capability model and a"], [1936, "  registry. S3/GCS/etc. and TOML-driven backend configuration are deferred (external SDK + security review)."]], "section": {"id": "sec:gears/file-storage/docs/DESIGN.md#48-p1-implementation-notes--decisions", "title": "P1 implementation notes & decisions", "line": 1897}}], "gear": "gears/file-storage", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/file-storage/docs/DESIGN.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "edaa2768ddde1599", "rule": "contradiction.value", "gate": "advise", "subject": "expired multipart session version / reclamation timing: retention-cleanup.md:342 vs retention-cleanup.md:406", "message": "Both describe current behavior for a previously protected version after its multipart session expires and is aborted by step 2. Passage A explicitly says step 1 reclaims the version in the same sweep call; passage B says it becomes reclaimable only in a subsequent cycle. These require different reclamation timing for the same case.", "locations": [{"path": "gears/file-storage/docs/features/retention-cleanup.md", "line_start": 342, "line_end": 345, "quote": "A session whose `expires_at` has **already passed** is deliberately **not** excluded by this guard — that\nversion becomes reclaimable, but only after [Sweep Expired Multipart\nSessions](#sweep-expired-multipart-sessions) (step 2, running in the same cycle) has transitioned the session out of\n`in_progress`;", "text": [[341, "than `orphan_grace_secs`, and without this guard the sweep would delete the version out from under the in-progress"], [342, "upload. A session whose `expires_at` has **already passed** is deliberately **not** excluded by this guard — that"], [343, "version becomes reclaimable, but only after [Sweep Expired Multipart"], [344, "Sessions](#sweep-expired-multipart-sessions) (step 2, running in the same cycle) has transitioned the session out of"], [345, "`in_progress`; step 1 and step 2 run in a fixed order within one `run_sweep` call, so a session that expires exactly"], [346, "between them is reclaimed on the *next* cycle, not silently missed. The same live-session check is repeated,"]], "section": {"id": "sec:gears/file-storage/docs/features/retention-cleanup.md#live-multipart-session-guard-p2-remediation-28", "title": "Live-Multipart-Session Guard (P2 Remediation 2.8)", "line": 330}}, {"path": "gears/file-storage/docs/features/retention-cleanup.md", "line_start": 406, "line_end": 407, "quote": "Once that same session's `expires_at` has also passed, the session is aborted by the sweep's own step 2 and\nits previously-protected version becomes reclaimable by step 1 on a subsequent cycle", "text": [[405, "  the zero-version-orphan-file check (`has_blocking_multipart_session`)"], [406, "- [x] Once that same session's `expires_at` has also passed, the session is aborted by the sweep's own step 2 and"], [407, "  its previously-protected version becomes reclaimable by step 1 on a subsequent cycle"], [408, "- [x] An expired multipart session is aborted via a CAS (`in_progress -> aborted`) that a concurrent"]], "section": {"id": "sec:gears/file-storage/docs/features/retention-cleanup.md#6-acceptance-criteria", "title": "Acceptance Criteria", "line": 385}}], "gear": "gears/file-storage", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/file-storage/docs/features/retention-cleanup.md"], "path": null, "hops": null, "section_linked": false}, {"fingerprint": "a5a3353a5adde03f", "rule": "contradiction.access", "gate": "advise", "subject": "file metadata api / read surface and data: DESIGN.md:109 vs api.md:64", "message": "Both passages agree that GET returns metadata JSON. However, A specifies an active HEAD metadata route, while B explicitly states that no such route exists. An implementation must choose whether to provide that route.", "locations": [{"path": "gears/file-storage/docs/DESIGN.md", "line_start": 109, "line_end": 109, "quote": "Control `GET /files/{id}` (metadata JSON) and `HEAD /files/{id}` (headers) read `files` + `files_custom_metadata` via `metadata-service` — no content on this surface", "text": [[108, "| `cpt-cf-file-storage-fr-delete-file`                   | Control `DELETE /files/{id}` (requires `If-Match`): **metadata-row-first** — the `files` row and **all** its version rows are deleted in a committed transaction and `204` is returned, *then* the sidecar deletes the backend objects best-effort; a failed backend delete leaves only unreferenced objects swept by the P2 cleanup engine (never a row pointing at missing bytes). Idempotent: re-deleting returns `404`. Sequence in §3.6 |"], [109, "| `cpt-cf-file-storage-fr-get-metadata`                  | Control `GET /files/{id}` (metadata JSON) and `HEAD /files/{id}` (headers) read `files` + `files_custom_metadata` via `metadata-service` — no content on this surface                                          |"], [110, "| `cpt-cf-file-storage-fr-list-files`                    | `GET /files` with mandatory `owner_kind` filter; tenant-scoped DB query through `metadata-service`                                                                       |"]], "section": {"id": "sec:gears/file-storage/docs/DESIGN.md#functional-drivers-p1", "title": "Functional Drivers (P1)", "line": 102}}, {"path": "gears/file-storage/docs/api.md", "line_start": 64, "line_end": 64, "quote": "6.  GET    /files/{id}                      file metadata (JSON)                                          — If-None-Match", "text": [[63, "5.  PATCH  /files/{id}                      update custom metadata (JSON Merge Patch)        — If-Match, If-Match-Metadata?"], [64, "6.  GET    /files/{id}                      file metadata (JSON)                                          — If-None-Match"], [65, "7.  DELETE /files/{id}                      delete file + all versions                                    — If-Match"]], "section": {"id": "sec:gears/file-storage/docs/api.md#p1--control-plane-apifile-storagev1", "title": "P1 — Control plane (`/api/file-storage/v1`)", "line": 56}}], "gear": "gears/file-storage", "source": "llm:local-main+cloud-mini>cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different access rules for one thing", "origin": "corpus", "docs": ["gears/file-storage/docs/DESIGN.md", "gears/file-storage/docs/api.md"], "path": ["gears/file-storage/docs/DESIGN.md", "gears/file-storage/docs/api.md"], "hops": 1, "section_linked": false}, {"fingerprint": "1a78d4f3efccf302", "rule": "contradiction.lifecycle", "gate": "advise", "subject": "multipart upload on non native backend / part storage: DESIGN.md:799 vs PRD.md:318", "message": "Both passages specify the P2 multipart contract. A provides a sidecar offset-write mechanism for multipart uploads on non-native backends, while B forbids that fallback and requires single-part uploads instead. A's explicit exclusion of local-filesystem does not resolve the disagreement for other non-native backends.", "locations": [{"path": "gears/file-storage/docs/DESIGN.md", "line_start": 799, "line_end": 800, "quote": "for a non-native backend the sidecar offset-writes each part into the single\n  new-version object `/{file_id}/{version_id}` (still never mutating an existing object).", "text": [[798, "- -cpt-cf-file-storage-adr-content-hash-modes.md:52", "message": "a later decision changed this; the earlier record still states it as current: ADR-0006 explicitly supersedes ADR-0002's open-ended algorithm-selection plan with two SHA-256-only modes. The earlier plan is historical, not a competing current requirement. Moreover, passage A's specific statement that algorithm selection is a platform decision is compatible with the platform mandating SHA-256 for both modes.", "locations": [{"path": "gears/file-storage/docs/ADR/0002-cpt-cf-file-storage-adr-content-hash-selection.md", "line_start": 263, "line_end": 263, "quote": "* `cpt-cf-file-storage-adr-sidecar-data-plane` — Because all content traffic transits the sidecar, hashing happens on the sidecar streaming path; the algorithm choice is a platform decision rather than a backend-native concern", "text": [[262, ""], [263, "* `cpt-cf-file-storage-adr-sidecar-data-plane` — Because all content traffic transits the sidecar, hashing happens on the sidecar streaming path; the algorithm choice is a platform decision rather than a backend-native concern"], [264, "* `cpt-cf-file-storage-fr-multipart-upload` — P2 multipart upload is the trigger for opening the algorithm choice; tree-mode finalization for BLAKE3 backends interacts with the multipart wire protocol"]], "section": {"id": "sec:gears/file-storage/docs/ADR/0002-cpt-cf-file-storage-adr-content-hash-selection.md#traceability", "title": "Traceability", "line": 255}}, {"path": "gears/file-storage/docs/ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md", "line_start": 52, "line_end": 54, "quote": "The maintainer has since simplified the decision further: **BLAKE3 is dropped entirely.** There are exactly **two** content-hash modes, both built on SHA-256 alone, distinguished only by upload path (non-multipart vs. multipart) — not by user or operator choice.", "text": [[51, "explored a 3-mode design built around `blake3::hazmat`'s canonical subtree-combination API (non- nly by upload path (non-multipart vs. multipart) — not by user or operator choice."], [55, ""]], "section": {"id": "sec:gears/file-storage/docs/ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md#context-and-problem-statement", "title": "Context and Problem Statement", "line": 36}}, {"path": "gears/file-storage/docs/operations.md", "line_start": 238, "line_end": 239, "quote": "Content-hash modes (whole-object SHA-256; multipart offset-manifest) are a proposed future design — see [ADR-0006](./ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md); not implemented.", "text": [[237, ""], [238, "Content-hash modes (whole-object SHA-256; multipart offset-manifest) are a proposed future design — see"], [239, "[ADR-0006](./ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md); not implemented."], [240, ""]], "section": {"id": "sec:gears/file-storage/docs/operations.md#storage-quota-not-enforced", "title": "Storage quota (not enforced)", "line": 220}}], "gear": "gears/file-storage", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "A decision is stated as made, and elsewhere as still open", "origin": "corpus", "docs": ["gears/file-storage/docs/ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md", "gears/file-storage/docs/operations.md"], "path": ["gears/file-storage/docs/ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md", "gears/file-storage/docs/operations.md"], "hops": 1, "section_linked": true}, {"fingerprint": "ac429f290b728ba7", "rule": "contradiction.decision", "gate": "advise", "subject": "non multipart hash mode / hash construction: 0006-cpt-cf-file-storage-adr-content-hash-modes.md:92 vs 0002-cpt-cf-file-storage-adr-content-hash-selection.md:39", "message": "The hash constructions agree, but their decision status does not. A presents the two-mode design as chosen, whereas B explicitly identifies that same ADR as proposed. The excerpts provide no explicit confirmation that the proposal was subsequently adopted, so A presents an open decision as settled.", "locations": [{"path": "gears/file-storage/docs/ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md", "line_start": 92, "line_end": 93, "quote": "Exactly 2 modes (non-multipart whole-object SHA-256; multipart SHA-256 offset-manifest composite), computed on-the-fly during upload, no re-read — **chosen**", "text": [[91, ""], [92, "* Exactly 2 modes (non-multipart whole-object SHA-256; multipart SHA-256 offset-manifest composite), computed"], [93, "  on-the-fly during upload, no re-read — **chosen**"], [94, "* 3-mode design with BLAKE3-tree for multipart (this ADR's own prior draft, before implementation) — superseded"]], "section": {"id": "sec:gears/file-storage/docs/ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md#considered-options", "title": "Considered Options", "line": 90}}, {"path": "gears/file-storage/docs/ADR/0002-cpt-cf-file-storage-adr-content-hash-selection.md", "line_start": 39, "line_end": 39, "quote": "narrows and formalizes the P2+ content-hash decision to exactly **two** modes, both built on **SHA-256 alone — no second algorithm, no BLAKE3**: non-multipart whole-object SHA-256, and multipart SHA-256 **offset-manifest composite**", "text": [[38, ">"], [39, "> **ADR-0002's P2 vision is superseded by [ADR-0006: Content-Hash Modes — Whole-Object SHA-256 & Multipart Offset-Manifest Composite (SHA-256)](./0006-cpt-cf-file-storage-adr-content-hash-modes.md).** The `hash_policy` config block (`default_algorithm`, `allowed_algorithms`, `selection_rules`), the capability-discovery endpoint, and the BLAKE3 \"combine per-chunk chunk states into the tree root\" finalization narrative described below in Decision Outcome and Consequences were **never implemented** and are **not** the P2+ plan going forward. ADR-0006 (`status: proposed`) narrows and formalizes the P2+ content-hash decision to exactly **two** modes, both built on **SHA-256 alone — no second algorithm, no BLAKE3**: non-multipart whole-object SHA-256, and multipart SHA-256 **offset-manifest composite** (a canonical manifest of per-part offsets and SHA-256 digests, with `root = sha256(manifest)`, independently re-verifiable by any holder of the object bytes plus the returned manifest). Both modes are computed **on-the-fly during upload, never by re-reading the stored object**. Because both modes use only SHA-256, there is no FIPS feature-gating, no Cargo feature flag, and no non-approved-algorithm carve-out to reason about. Read ADR-0006 for the authoritative P2+ decision; treat this ADR's P2 prose (Decision Outcome's second half, and the \"P2 …\" bullets in Consequences) as **historical vision that was consciously not built**, not a live plan."], [40, ">"]], "section": {"id": "sec:gears/file-storage/docs/ADR/0002-cpt-cf-file-storage-adr-content-hash-selection.md#superseded-note-2026-07-07", "title": "Superseded Note (2026-07-07)", "line": 35}}], "gear": "gears/file-storage", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "A decision is stated as made, and elsewhere as still open", "origin": "corpus", "docs": ["gears/file-storage/docs/ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md", "gears/file-storage/docs/ADR/0002-cpt-cf-file-storage-adr-content-hash-selection.md"], "path": ["gears/file-storage/docs/ADR/0006-cpt-cf-file-storage-adr-content-hash-modes.md", "gears/file-storage/docs/ADR/0002-cpt-cf-file-storage-adr-content-hash-selection.md"], "hops": 1, "section_linked": true}, {"fingerprint": "226f5d0a8911eb3b", "rule": "reference.misattributed", "gate": "advise", "subject": "ADR-0003: Split the Data Plane into a Signed-URL Sidecar / what it is cited for: 0005-cpt-cf-file-storage-adr-s3-client-selection.md:82 vs 0003-cpt-cf-file-storage-adr-sidecar-data-plane.md:6", "message": "A cites ADR-0003 as establishing a security-review policy for external data-plane dependencies. B instead decides to split FileStorage into a control plane and signed-URL sidecar, specifying their responsi lane.md"], "hops": 1, "section_linked": false}, {"fingerprint": "57aad2ab7bdc00ef", "rule": "reference.misattributed", "gate": "advise", "subject": "ADR-0004: Signed-URL Token Format & Transport / what it is cited for: DESIGN.md:1760 vs 0004-cpt-cf-file-storage-adr-signed-url-transport.md:6", "message": "ADR-0004 supports bare, embeddable query-token URLs without custom headers, but explicitly excludes shareable links from P1. Thus the citation supports the bare-URL/no-header consequence, but contradicts A's characterization of that URL as shareable.", "locations": [{"path": "gears/file-storage/docs/DESIGN.md", "line_start": 1760, "line_end": 1760, "quote": "10. The LMS drops that URL straight into the page — it is a **bare, shareable URL** (ADR-0004), so no JS/header glue:", "text": [[1759, ""], [1760, "10. The LMS drops that URL straight into the page — it is a **bare, shareable URL** (ADR-0004), so no JS/header glue:"], [1761, ""]], "section": {"id": "sec:gears/file-storage/docs/DESIGN.md#phase-2--display-in-the-browser", "title": "Phase 2 — Display in the browser", "line": 1729}}, {"path": "gears/file-storage/docs/ADR/0004-cpt-cf-file-storage-adr-signed-url-transport.md", "line_start": 6, "line_end": 6, "quote": "# ADR-0004: Signed-URL Token Format & Transport", "text": [[5, ""], [6, "# ADR-0004: Signed-URL Token Format & Transport"], [7, ""]], "section": {"id": "sec:gears/file-storage/docs/ADR/0004-cpt-cf-file-storage-adr-signed-url-transport.md#adr-0004-signed-url-token-format--transport", "title": "ADR-0004: Signed-URL Token Format & Transport", "line": 6}}], "gear": "gears/file-storage", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "A citation points at a record about something else", "origin": "corpus", "docs": ["gears/file-storage/docs/DESIGN.md", "gears/file-storage/docs/ADR/0004-cpt-cf-file-storage-adr-signed-url-transport.md"], "path": ["gears/file-storage/docs/DESIGN.md", "gears/file-storage/docs/ADR/0004-cpt-cf-file-storage-adr-signed-url-transport.md"], "hops": 1, "section_linked": false}, {"fingerprint": "9bdce790a124d16e", "rule": "contradiction.lifecycle", "gate": "advise", "subject": "provider request after consumer disconnect / behavior: DESIGN.md:559 vs PRD.md:566", "message": "Both passages specify behavior when a consumer disconnects during streaming. Passage A requires keeping the provider request running to completion, while passage B requires cancelling it. These are incompatible actions for the same trigger, and neither passage marks its behavior as historical, proposed, or superseded.", "locations": [{"path": "gears/llm-gateway/docs/DESIGN.md", "line_start": 559, "line_end": 559, "quote": "- **Consumer disconnect does not abort the provider request**: If the consumer disconnects, Gateway continues reading the provider stream to completion. This ensures token usage is fully reported to the Usage Tracker. The provider response is discarded after the stream closes.", "text": [[558, "- **No provider fallback after first delta**: Provider fallback (see `cpt-cf-llm-gateway-seq-provider-fallback-v1`) is only attempted before streaming begins. Once any delta event has been sent to the consumer, the stream is committed to the current provider — switching providers mid-stream is not possible."], [559, "- **Consumer disconnect does not abort the provider request**: If the consumer disconnects, Gateway continues reading the provider stream to completion. This ensures token usage is fully reported to the Usage Tracker. The provider response is discarded after the stream closes. If the provider stream itself terminates before delivering usage data (network error, provider error mid-stream), the handling policy is an open question — see PRD section 13 \"Budget enforcement edge cases\"."], [560, "- **Usage is always requested from providers**: Gateway always sets `stream_options: {include_usage: true}` on provider requests regardless of the consumer's `stream_options` value. Token usage is required for billing. The consumer's `stream_options.include_usage` controls only whether the `response.completed` event exposes usage to the consumer — it does not affect what Gateway requests from the provider."]], "section": {"id": "sec:gears/llm-gateway/docs/DESIGN.md#33-api-contracts", "title": "API Contracts", "line": 358}}, {"path": "gears/llm-gateway/docs/PRD.md", "line_start": 566, "line_end": 566, "quote": "- **Consumer disconnects**: Gateway cancels upstream provider request and reports usage for consumed tokens.", "text": [[565, "- **Mid-stream provider failure**: Gateway closes stream with error event and reports partial usage."], [566, "- **Consumer disconnects**: Gateway cancels upstream provider request and reports usage for consumed tokens."], [567, "- **Model not capable**: Gateway returns capability_not_supported error if model does not support streaming."]], "section": {"id": "sec:gears/llm-gateway/docs/PRD.md#uc-002-streaming-chat-completion", "title": "UC-002: Streaming Chat Completion", "line": 547}}], "gear": "gears/llm-gateway", "source": "llm:local-main+cloud-mini>cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give a different lifecycle or timing for one thing", "origin": "corpus", "docs": ["gears/llm-gateway/docs/DESIGN.md", "gears/llm-gateway/docs/PRD.md"], "path": ["gears/llm-gateway/docs/DESIGN.md", "gears/llm-gateway/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "a57ab1f3f712d354", "rule": "contradiction.lifecycle", "gate": "advise", "subject": "post response hook / invocation time: DESIGN.md:1208 vs PRD.md:964", "message": "For non-streaming responses, A places hook invocation after delivery to the consumer, while B's numbered flow places invocation and processing before delivery. Observe-only behavior does not resolve this ordering difference. The passages agree on streaming, where B explicitly says the response has already been delivered.", "locations": [{"path": "gears/llm-gateway/docs/DESIGN.md", "line_start": 1208, "line_end": 1214, "quote": "C->>GW: POST /responses (...)\n    GW->>OB: Request\n    OB->>P: Request\n    P-->>OB: Response\n    OB-->>GW: Normalized response\n    GW-->>C: Response\n    GW->>HP: post_response(response)", "text": [[1207, ""], [1208, "    C->>GW: POST /responses (...)"], [1209, "    GW->>OB: Request"], [1210, "    OB->>P: Request"], [1211, "    P-->>OB: Response"], [1212, "    OB-->>GW: Normalized response"], [1213, "    GW-->>C: Response"], [1214, "    GW->>HP: post_response(response)"], [1215, "    alt Timeout exceeded"]], "section": {"id": "sec:gears/llm-gateway/docs/DESIGN.md#post-response-interceptor", "title": "Post-Response Interceptor", "line": 1193}}, {"path": "gears/llm-gateway/docs/PRD.md", "line_start": 964, "line_end": 965, "quote": "1. Provider adapter returns normalized response (for streaming: after all chunks received and full response assembled; for async/batch: after job completes)\n2. Gateway invokes all enabled Hook Plugins in order (post_response)", "text": [[963, "**Flow**:"], [964, "1. Provider adapter returns normalized response (for streaming: after all chunks received and full response assembled; for async/batch: after job completes)"], [965, "2. Gateway invokes all enabled Hook Plugins in order (post_response)"], [966, "3. Each plugin observes and processes the response (e.g., logging, metrics); plugin outcome has no effect on response delivery"]], "section": {"id": "sec:gears/llm-gateway/docs/PRD.md#uc-018-post-response-interceptor", "title": "UC-018: Post-Response Interceptor", "line": 956}}], "gear": "gears/llm-gateway", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give a different lifecycle or timing for one thing", "origin": "corpus", "docs": ["gears/llm-gateway/docs/DESIGN.md", "gears/llm-gateway/docs/PRD.md"], "path": ["gears/llm-gateway/docs/DESIGN.md", "gears/llm-gateway/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "5e4cf0639b0affee", "rule": "contradiction.value", "gate": "advise", "subject": "structured output validation / failure behavior: DESIGN.md:984 vs PRD.md:801", "message": "Both passages specify the error returned for schema-validation failure in the same structured-output use case, but name it differently: output_validation_error versus validation_error. An implementer must choose which error identifier to return. The additional requirements about no retries and error details are compatible; the conflict is the error name.", "locations": [{"path": "gears/llm-gateway/docs/DESIGN.md", "line_start": 984, "line_end": 984, "quote": "- On failure, `output_validation_error` is returned immediately — no retries.", "text": [[983, "- Gateway validates the provider's JSON output against the requested schema before returning the response."], [984, "- On failure, `output_validation_error` is returned immediately — no retries."], [985, "- For streaming requests (`stream: true`), schema validation is not enforced by Gateway — the schema is forwarded to the provider but the streamed output is not buffered and re-validated. Consumers must validate streamed output themselves."]], "section": {"id": "sec:gears/llm-gateway/docs/DESIGN.md#structured-output", "title": "Structured Output", "line": 973}}, {"path": "gears/llm-gateway/docs/PRD.md", "line_start": 801, "line_end": 807, "quote": "**Alternative Flows**:\n- **Schema validation failure**: Gateway returns validation_error with details if response does not match schema.\n- **Provider error**: Gateway normalizes error and returns to consumer.\n\n**Acceptance criteria**:\n- Response validated against provided schema\n- Returns validation_error with details if schema validation fails", "text": [[800, ""], [801, "**Alternative Flows**:"], [802, "- **Schema validation failure**: Gateway returns validation_error with details if response does not match schema."], [803, "- **Provider error**: Gateway normalizes error and returns to consumer."], [804, ""], [805, "**Acceptance criteria**:"], [806, "- Response validated against provided schema"], [807, "- Returns validation_error with details if schema validation fails"], [808, "- Response in normalized format"]], "section": {"id": "sec:gears/llm-gateway/docs/PRD.md#uc-011-structured-output", "title": "UC-011: Structured Output", "line": 784}}], "gear": "gears/llm-gateway", "source": "llm:local-main+cloud-mini>cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/llm-gateway/docs/DESIGN.md", "gears/llm-gateway/docs/PRD.md"], "path": ["gears/llm-gateway/docs/DESIGN.md", "gears/llm-gateway/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "be6f36e750370ff2", "rule": "contradiction.value", "gate": "advise", "subject": "structured output validation / streaming behavior: DESIGN.md:985 vs PRD.md:295", "message": "B requires provider-response validation for structured-output requests without exempting streaming. A explicitly disables Gateway validation for streaming and assigns it to consumers. Implementing A's streaming behavior would therefore violate B's unqualified validation requirement.", "locations": [{"path": "gears/llm-gateway/docs/DESIGN.md", "line_start": 985, "line_end": 985, "quote": "- For streaming requests (`stream: true`), schema validation is not enforced by Gateway — the schema is forwarded to the provider but the streamed output is not buffered and re-validated.", "text": [[984, "- On failure, `output_validation_error` is returned immediately — no retries."], [985, "- For streaming requests (`stream: true`), schema validation is not enforced by Gateway — the schema is forwarded to the provider but the streamed output is not buffered and re-validated. Consumers must validate streamed output themselves."], [986, ""]], "section": {"id": "sec:gears/llm-gateway/docs/DESIGN.md#structured-output", "title": " : aspect_ratio (1:1, 2:3, 3:2, 3:4, 4:3, 9:16, 16:9), resolution (megapixels: 0.5, 1, 2, 4), quality (low, medium, high, auto), output_format (png, jpeg, webp), output_compression (0–100, for jpeg), response_format (base64, url). See [ADR-0006](./ADR/0006-cpt-cf-llm-gateway-adr-image-generation-api.md)."], [248, ""]], "section": {"id": "sec:gears/llm-gateway/docs/DESIGN.md#31-domain-model", "title": "Domain Model", "line": 182}}, {"path": "gears/llm-gateway/docs/PRD.md", "line_start": 631, "line_end": 639, "quote": "**Flow**:\n1. Consumer sends generation request with prompt\n2. Gateway resolves provider via Model Registry\n3. Gateway sends request via Outbound API Gateway\n4. Provider returns generated image\n5. Gateway stores image in FileStorage\n6. Gateway returns URL with usage\n\n**Postconditions**: Image stored, URL returned, usage reported.", "text": [[630, ""], [631, "**Flow**:"], [632, "1. Consumer sends generation request with prompt"], [633, "2. Gateway resolves provider via Model Registry"], [634, "3. Gateway sends request via Outbound API Gateway"], [635, "4. Provider returns generated image"], [636, "5. Gateway stores image in FileStorage"], [637, "6. Gateway returns URL with usage"], [638, ""], [639, "**Postconditions**: Image stored, URL returned, usage reported."], [640, ""]], "section": {"id": "sec:gears/llm-gateway/docs/PRD.md#uc-005-image-generation", "title": "UC-005: Image Generation", "line": 624}}], "gear": "gears/llm-gateway", "source": "llm:cloud-strong@contradiction-judge/2", "suggestion": null, "title": "Two passages give different values for one thing", "origin": "corpus", "docs": ["gears/llm-gateway/docs/DESIGN.md", "gears/llm-gateway/docs/PRD.md"], "path": ["gears/llm-gateway/docs/DESIGN.md", "gears/llm-gateway/docs/PRD.md"], "hops": 1, "section_linked": false}, {"fingerprint": "25170f84758e62df", "rule": "stale.decision-record", "gate": "advise", "subject": "consumer / manage and provide: 0001-fdd-llmgw-adr-stateless.md:46 vs 0007-cpt-cf-llm-gateway-adr-no-stored-responses.md:39", "message": "a later decision changed this; the earlier record still states it as current: Passage A (ADR-0001) states that a consequence of the stateless design is that 'consumers must manage and provide conversation context'. Passage B (ADR-0007), which is explicitly dated later (2026-03-26) and references ADR-0001 as an established architectural decision, confirms this by stating 'consumers already manage their own context' as a current fact. The second passage treats the requirement from the first passage as an existing reality rather than a contradiction. Therefore, Passage B cites the outcome of the earlier decision, making the earlier record history in this specific context, not a conflict.", "locations": [{"path": "gears/llm-gateway/docs/ADR/0001-fdd-llmgw-adr-stateless.md", "line_start": 46, "line_end": 46, "quote": "* Bad, because consumers must manage and provide conversation context", "text": [[45, "* Good, because no state synchronization between nodes required"], [46, "* Bad, because consumers must manage and provide conversation context"], [47, "* Exception: temporary async job state stored in distributed cache"]], "section": {"id": "sec:gears/llm-gateway/docs/ADR/0001-fdd-llmgw-adr-stateless.md#consequences", "title": "Consequences", "line": 42}}, {"path": "gears/llm-gateway/docs/ADR/0007-cpt-cf-llm-gateway-adr-no-stored-responses.md", "line_start": 39, "line_end": 39, "quote": "consumers already manage their own context", "text": [[38, "* Stateless architecture alignment — ADR-0001 established that Gateway does not store conversation history; introducing stored responses would fundamentally contradict this architectural decision"], [39, "* Minimal viable scope — the Gateway can deliver full value for all supported modalities without server-side conversation state; consumers already manage their own context"], [40, ""]], "section": {"id": "sec:gears/llm-gateway/docs/ADR/0007-cpt-cf-llm-gateway-adr-no-st

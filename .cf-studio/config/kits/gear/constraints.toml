# Gear Creation Kit — deterministic artifact contracts
#
# Heading contracts, cpt identifier templates, and cross-artifact coverage for
# the seven gear artifact kinds. Structure aligns with the gears-rust spec
# templates (docs/spec-templates/gears-sdlc/*) and the SDLC kit contract;
# gear-specific sections (classification, gear structure, gate results) are
# kit-owned additions.

# ── GEAR-INTENT ───────────────────────────────────────────────────────

[[artifacts.GEAR-INTENT.headings]]
id = "intent-h1-title"
level = 1
required = true
multiple = false
numbered = false
pattern = "GEAR-INTENT\\s*[—–-]\\s*.+"
description = "Intent title: GEAR-INTENT — <request name>."

[[artifacts.GEAR-INTENT.headings]]
id = "intent-request"
level = 2
required = true
multiple = false
numbered = false
pattern = "Request"
description = "The need in the requester's terms: problem, desired capability, acceptance outcome."

[[artifacts.GEAR-INTENT.headings]]
id = "intent-classification"
level = 2
required = true
multiple = false
numbered = false
pattern = "Classification"
description = "Request class (new gear | plugin | docs-only spec | small fix) with justification."

[[artifacts.GEAR-INTENT.headings]]
id = "intent-similar-gears"
level = 2
required = true
multiple = false
numbered = false
pattern = "Similar Gears"
description = "Catalog lookup results: closest existing gears and the reuse-or-build call."

[[artifacts.GEAR-INTENT.headings]]
id = "intent-reuse-profile"
level = 2
required = true
multiple = false
numbered = false
pattern = "Reuse Profile"
description = "Archetype, reference gear to imitate, core/optional toolkit libraries, platform dependencies."

[[artifacts.GEAR-INTENT.headings]]
id = "intent-document-set"
level = 2
required = true
multiple = false
numbered = false
pattern = "Document Set"
description = "Which specification documents this request needs, and why."

[[artifacts.GEAR-INTENT.headings]]
id = "intent-route"
level = 2
required = true
multiple = false
numbered = false
pattern = "Route Decision"
description = "The confirmed route: workflow sequence and first next step."

[artifacts.GEAR-INTENT.identifiers.intent]
name = "Gear Intent"
description = "One classified gear-creation request; the root of the gear's traceability chain."
required = true
task = false
priority = false
to_code = false
template = "cpt-{system}-intent-{slug}"
headings = ["intent-h1-title"]

